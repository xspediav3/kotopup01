<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Users - FelixTopUp Comic Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
:root {
    --sidebar-width: 268px;
    --topbar-height: 74px;
    --comic-border: 3.5px solid #111319;
    --comic-shadow: 5px 5px 0px #111319;
    --comic-shadow-sm: 3px 3px 0px #111319;
    --comic-shadow-lg: 8px 8px 0px #111319;

    --bg-cream: #FFFDF5;
    --bg-panel: #FFFFFF;
    --ink-black: #111319;
    --ink-muted: #4A5568;

    --c-blue: #3B82F6;
    --c-blue-soft: #DBEAFE;
    --c-green: #10B981;
    --c-green-soft: #D1FAE5;
    --c-yellow: #FBBF24;
    --c-yellow-soft: #FEF3C7;
    --c-cyan: #06B6D4;
    --c-cyan-soft: #CFFAFE;
    --c-red: #EF4444;
    --c-red-soft: #FEE2E2;
    --c-purple: #8B5CF6;
    --c-purple-soft: #EDE9FE;
    --c-orange: #F97316;
    --c-orange-soft: #FFEDD5;
    --c-slate: #64748B;
    --c-slate-soft: #F1F5F9;

    --font-display: 'Bangers', cursive, sans-serif;
    --font-comic: 'Comic Neue', 'Plus Jakarta Sans', sans-serif;
    --font-ui: 'Plus Jakarta Sans', sans-serif;
}

*, *::before, *::after {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: var(--font-ui);
    background-color: var(--bg-cream);
    background-image: radial-gradient(#111319 1.1px, transparent 1.1px);
    background-size: 18px 18px;
    color: var(--ink-black);
    font-size: 0.94rem;
    line-height: 1.4;
    overflow-x: hidden;
}

.comic-title {
    font-family: var(--font-display);
    letter-spacing: 1.2px;
    text-transform: uppercase;
}

a {
    text-decoration: none;
    color: inherit;
}

.page-wrapper {
    display: flex;
    min-height: 100vh;
}

.sidebar {
    width: var(--sidebar-width);
    min-width: var(--sidebar-width);
    height: 100vh;
    position: fixed;
    top: 0;
    left: 0;
    background-color: var(--c-yellow);
    border-right: var(--comic-border);
    z-index: 1030;
    transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
    display: flex;
    flex-direction: column;
    box-shadow: 4px 0px 0px rgba(17, 19, 25, 0.12);
}

.sidebar-brand {
    padding: 1.15rem 1.2rem;
    background: var(--c-blue);
    color: #FFFFFF;
    border-bottom: var(--comic-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.brand-lockup {
    display: flex;
    align-items: center;
    gap: 0.65rem;
}

.brand-badge {
    width: 40px;
    height: 40px;
    background: var(--c-yellow);
    color: var(--ink-black);
    border: 3px solid var(--ink-black);
    border-radius: 10px;
    display: grid;
    place-items: center;
    font-size: 1.3rem;
    box-shadow: 2px 2px 0px var(--ink-black);
    transform: rotate(-4deg);
}

.brand-text {
    font-family: var(--font-display);
    font-size: 1.8rem;
    letter-spacing: 1.5px;
    text-shadow: 2px 2px 0px var(--ink-black);
    line-height: 1;
}

.brand-sub {
    display: block;
    font-family: var(--font-ui);
    font-size: 0.68rem;
    font-weight: 800;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    background: var(--ink-black);
    color: var(--c-yellow);
    padding: 2px 7px;
    border-radius: 5px;
    margin-top: 4px;
    width: fit-content;
}

.sidebar-nav {
    list-style: none;
    padding: 0.9rem 0.8rem;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    flex: 1;
}

.nav-item .nav-link {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding: 0.7rem 0.9rem;
    background: var(--bg-panel);
    color: var(--ink-black);
    font-weight: 800;
    font-size: 0.9rem;
    border: 3px solid var(--ink-black);
    border-radius: 11px;
    box-shadow: var(--comic-shadow-sm);
    transition: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.12s ease;
}

.nav-item .nav-link:hover {
    transform: translate(-2px, -2px);
    box-shadow: 5px 5px 0px var(--ink-black);
    background: var(--c-cyan-soft);
}

.nav-item .nav-link.active {
    background: var(--c-orange);
    color: #FFFFFF;
}

.nav-item.logout {
    margin-top: auto;
    padding-top: 0.7rem;
    border-top: 3px dashed var(--ink-black);
}

.nav-item.logout .nav-link {
    background: var(--c-red-soft);
    color: #991B1B;
}

.nav-item.logout .nav-link:hover {
    background: var(--c-red);
    color: #FFFFFF;
}

.content-wrapper {
    width: calc(100% - var(--sidebar-width));
    margin-left: var(--sidebar-width);
    transition: margin-left 0.24s ease, width 0.24s ease;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.topbar {
    height: var(--topbar-height);
    background-color: var(--bg-panel);
    border-bottom: var(--comic-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.85rem;
    padding: 0 1.5rem;
    position: sticky;
    top: 0;
    z-index: 1010;
}

.topbar-left {
    display: flex;
    align-items: center;
    gap: 0.75rem;
}

.sidebar-toggle-btn {
    background: var(--c-yellow);
    border: 3px solid var(--ink-black);
    border-radius: 10px;
    width: 40px;
    height: 40px;
    font-size: 1.3rem;
    cursor: pointer;
    color: var(--ink-black);
    display: none;
    place-items: center;
    box-shadow: 3px 3px 0px var(--ink-black);
}

.sidebar-toggle-btn:active {
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0px var(--ink-black);
}

.main-content {
    padding: 1.5rem;
    max-width: 1440px;
    width: 100%;
    margin: 0 auto;
}

.page-header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.85rem;
    margin-bottom: 1.2rem;
}

.page-heading {
    margin: 0;
    font-size: 2.2rem;
    line-height: 1.05;
    display: flex;
    align-items: center;
    gap: 0.6rem;
}

.caption-tag {
    background: var(--c-yellow);
    border: 2.5px solid var(--ink-black);
    box-shadow: 2.5px 2.5px 0px var(--ink-black);
    padding: 0.2rem 0.65rem;
    border-radius: 8px;
    font-family: var(--font-ui);
    font-size: 0.74rem;
    font-weight: 800;
    text-transform: uppercase;
}

.comic-panel {
    background: var(--bg-panel);
    border: var(--comic-border);
    border-radius: 15px;
    box-shadow: var(--comic-shadow);
    padding: 1.2rem;
    margin-bottom: 1.4rem;
}

.dashboard-grid {
    display: grid;
    gap: 1.1rem;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    margin-bottom: 1.4rem;
}

.stat-card {
    background-color: var(--bg-panel);
    border: var(--comic-border);
    border-radius: 14px;
    box-shadow: var(--comic-shadow);
    overflow: hidden;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
}

.stat-card:hover {
    transform: translate(-2px, -2px);
    box-shadow: 7px 7px 0px var(--ink-black);
}

.card-top-strip {
    height: 9px;
    border-bottom: 3px solid var(--ink-black);
}

.stat-card .card-body {
    padding: 1rem 1.15rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
}

.stat-card .card-title {
    font-size: 0.75rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin: 0 0 0.35rem 0;
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    border: 2px solid var(--ink-black);
}

.stat-card .card-value {
    font-size: 1.55rem;
    font-weight: 800;
    color: var(--ink-black);
    line-height: 1.15;
}

.card-icon-box {
    width: 46px;
    height: 46px;
    border-radius: 11px;
    border: 3px solid var(--ink-black);
    box-shadow: 2.5px 2.5px 0px var(--ink-black);
    display: grid;
    place-items: center;
    font-size: 1.35rem;
    flex-shrink: 0;
}

.theme-success .card-top-strip, .theme-success .card-icon-box { background: var(--c-green); color: #fff; }
.theme-success .card-title { background: var(--c-green-soft); color: #065F46; }

.theme-secondary .card-top-strip, .theme-secondary .card-icon-box { background: var(--c-slate); color: #fff; }
.theme-secondary .card-title { background: var(--c-slate-soft); color: #1E293B; }

.theme-primary .card-top-strip, .theme-primary .card-icon-box { background: var(--c-blue); color: #fff; }
.theme-primary .card-title { background: var(--c-blue-soft); color: #1E3A8A; }

.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.85rem;
    padding-bottom: 0.9rem;
    margin-bottom: 1rem;
    border-bottom: 3px dashed var(--ink-black);
}

.card-header h3 {
    margin: 0;
    font-size: 1.4rem;
}

.header-actions {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    flex-wrap: wrap;
}

.form-inline-group {
    display: flex;
    align-items: center;
    gap: 0.45rem;
}

.comic-input, .search-input, .action-input, .action-select {
    border: 2.5px solid var(--ink-black);
    border-radius: 9px;
    padding: 0.45rem 0.7rem;
    font-family: var(--font-ui);
    font-weight: 700;
    font-size: 0.86rem;
    background: var(--bg-panel);
    color: var(--ink-black);
    box-shadow: 2px 2px 0px var(--ink-black);
    outline: none;
}

.comic-input:focus, .search-input:focus, .action-input:focus, .action-select:focus {
    background: #FEFCE8;
}

.search-bar {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    border: 2.5px solid var(--ink-black);
    border-radius: 9px;
    padding: 0.4rem 0.7rem;
    background: var(--bg-panel);
    box-shadow: 2px 2px 0px var(--ink-black);
}

.search-bar input {
    border: none;
    outline: none;
    background: transparent;
    font-family: var(--font-ui);
    font-weight: 700;
    font-size: 0.86rem;
    color: var(--ink-black);
    min-width: 190px;
}

.action-btn, .save-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.3rem;
    background-color: var(--c-blue);
    color: #FFFFFF;
    border: 2.5px solid var(--ink-black);
    padding: 0.42rem 0.72rem;
    border-radius: 9px;
    cursor: pointer;
    font-family: var(--font-ui);
    font-weight: 800;
    font-size: 0.8rem;
    box-shadow: 2px 2px 0px var(--ink-black);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
    white-space: nowrap;
}

.action-btn:hover, .save-btn:hover {
    transform: translate(-1px, -1px);
    box-shadow: 3.5px 3.5px 0px var(--ink-black);
}

.action-btn:active, .save-btn:active {
    transform: translate(1.5px, 1.5px);
    box-shadow: 1px 1px 0px var(--ink-black);
}

.action-btn.delete-btn { background-color: var(--c-red); color: #fff; }
.action-btn.verify-btn { background-color: var(--c-cyan); color: var(--ink-black); }
.action-btn.unverify-btn { background-color: var(--c-yellow); color: var(--ink-black); }
.action-btn.edit-btn { background-color: var(--c-green); color: #fff; }
.save-btn { background-color: var(--c-green); color: #fff; padding: 0.6rem 1.15rem; font-size: 0.88rem; }

/* Compact High-Density Table */
.table-responsive {
    width: 100%;
    overflow-x: auto;
    border: 3px solid var(--ink-black);
    border-radius: 12px;
    background: var(--bg-panel);
    box-shadow: var(--comic-shadow-sm);
}

.data-table, .users-table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
    font-size: 0.86rem;
}

.data-table th, .data-table td,
.users-table th, .users-table td {
    padding: 0.52rem 0.68rem;
    border-bottom: 1.5px solid #E2E8F0;
    vertical-align: middle;
}

.data-table th, .users-table th {
    background: var(--ink-black);
    color: #FFFFFF;
    font-weight: 800;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;
}

.data-table tbody tr:nth-child(even),
.users-table tbody tr:nth-child(even) {
    background: #FFFDF7;
}

.data-table tbody tr:hover,
.users-table tbody tr:hover {
    background: var(--c-yellow-soft);
}

.data-table tbody tr:last-child td,
.users-table tbody tr:last-child td {
    border-bottom: none;
}

.user-cell-main {
    font-weight: 800;
    color: var(--ink-black);
    line-height: 1.15;
}

.user-cell-sub {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--ink-muted);
}

.otp-compact-inline {
    display: inline-flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.28rem;
    font-size: 0.75rem;
    font-weight: 700;
}

.otp-mini-code {
    font-family: monospace;
    font-weight: 800;
    background: var(--c-green-soft);
    color: #065F46;
    border: 1.5px solid var(--ink-black);
    padding: 1px 5px;
    border-radius: 5px;
}

.otp-mini-del {
    background: var(--c-red-soft);
    color: #991B1B;
    border: 1.5px solid var(--ink-black);
    border-radius: 5px;
    padding: 1px 5px;
    font-size: 0.7rem;
    font-weight: 800;
    cursor: pointer;
}

.otp-mini-del:hover {
    background: var(--c-red);
    color: #fff;
}

.row-actions-compact {
    display: inline-flex;
    align-items: center;
    gap: 0.28rem;
    white-space: nowrap;
}

.row-actions-compact .action-btn {
    padding: 0.26rem 0.48rem;
    font-size: 0.74rem;
    margin-right: 0;
}

.action-cell {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    flex-wrap: nowrap;
}

.action-select {
    padding: 0.28rem 0.42rem;
    font-size: 0.78rem;
}

.action-input {
    max-width: 120px;
    padding: 0.28rem 0.48rem;
    font-size: 0.78rem;
}

.status-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.2rem;
    padding: 0.16rem 0.48rem;
    font-size: 0.7rem;
    font-weight: 800;
    border-radius: 999px;
    border: 2px solid var(--ink-black);
    text-transform: uppercase;
    white-space: nowrap;
}

.status-success { background-color: var(--c-green-soft); color: #065F46; }
.status-pending { background-color: var(--c-yellow-soft); color: #78350F; }
.status-failed, .status-cancel, .status-expired { background-color: var(--c-red-soft); color: #991B1B; }

.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(17, 19, 25, 0.65);
    backdrop-filter: blur(2px);
    z-index: 1029;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s ease, visibility 0.2s ease;
}

.modal {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.95);
    z-index: 1050;
    background: var(--bg-panel);
    border: 4px solid var(--ink-black);
    border-radius: 16px;
    width: 94%;
    max-width: 880px;
    box-shadow: var(--comic-shadow-lg);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s ease, visibility 0.2s ease, transform 0.2s ease;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.modal.active, .modal-overlay.active {
    opacity: 1;
    visibility: visible;
}

.modal.active {
    transform: translate(-50%, -50%) scale(1);
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    padding: 0.9rem 1.25rem;
    background: var(--c-yellow);
    border-bottom: 3.5px solid var(--ink-black);
}

.modal-title {
    margin: 0;
    font-size: 1.4rem;
}

.modal-close-btn {
    background: var(--c-red);
    color: #FFFFFF;
    border: 2.5px solid var(--ink-black);
    border-radius: 8px;
    width: 34px;
    height: 34px;
    font-size: 1rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 2px 2px 0px var(--ink-black);
    display: grid;
    place-items: center;
}

.modal-body {
    padding: 1.25rem;
    overflow-y: auto;
    flex-grow: 1;
    max-height: 78vh;
}

.modal-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 0.45rem;
    margin-bottom: 1.15rem;
    padding-bottom: 0.65rem;
    border-bottom: 3px dashed var(--ink-black);
}

.tab-btn {
    background: var(--bg-cream);
    border: 2.5px solid var(--ink-black);
    border-radius: 9px;
    padding: 0.45rem 0.85rem;
    cursor: pointer;
    font-family: var(--font-ui);
    font-size: 0.84rem;
    font-weight: 800;
    color: var(--ink-black);
    box-shadow: 2px 2px 0px var(--ink-black);
}

.tab-btn.active {
    background: var(--ink-black);
    color: var(--c-yellow);
}

.tab-content {
    display: none;
}

.tab-content.active {
    display: block;
}

.detail-grid {
    display: grid;
    grid-template-columns: 165px 1fr;
    gap: 0.55rem 1.1rem;
    align-items: start;
}

.detail-grid dt {
    font-weight: 800;
    font-size: 0.82rem;
    text-transform: uppercase;
    color: var(--ink-muted);
}

.detail-grid dd {
    margin: 0;
    font-weight: 700;
    word-break: break-word;
}

.rekap-box {
    background-color: var(--bg-cream);
    border-radius: 12px;
    padding: 1rem 1.1rem;
    margin-top: 1rem;
    border: 3px solid var(--ink-black);
    box-shadow: 3px 3px 0px var(--ink-black);
}

.form-group {
    margin-bottom: 0.8rem;
}

.form-group label {
    display: block;
    font-weight: 800;
    font-size: 0.82rem;
    margin-bottom: 0.3rem;
    text-transform: uppercase;
}

.form-group input, .form-group select {
    width: 100%;
    padding: 0.55rem 0.75rem;
    font-size: 0.9rem;
    font-family: var(--font-ui);
    font-weight: 700;
    border: 2.5px solid var(--ink-black);
    border-radius: 9px;
    background: var(--bg-panel);
    box-shadow: 2px 2px 0px var(--ink-black);
}

.otp-code {
    font-family: monospace;
    font-size: 1.2rem;
    font-weight: 800;
    letter-spacing: 2px;
    background: var(--bg-panel);
    padding: 0.5rem;
    border-radius: 8px;
    border: 2.5px dashed var(--ink-black);
}

.otp-history-item {
    padding: 0.85rem 1rem;
    border: 2.5px solid var(--ink-black);
    border-radius: 11px;
    margin-bottom: 0.75rem;
    background: var(--bg-cream);
    box-shadow: 3px 3px 0px var(--ink-black);
}

.otp-history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.4rem;
}

.otp-code-display {
    font-family: monospace;
    font-size: 1.15rem;
    font-weight: 800;
    color: var(--ink-black);
}

#toast-container {
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 2000;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}

.toast-message {
    background-color: var(--ink-black);
    color: #FFFFFF;
    padding: 0.75rem 1.15rem;
    border: 3px solid var(--ink-black);
    border-radius: 11px;
    box-shadow: var(--comic-shadow-sm);
    font-weight: 800;
    font-size: 0.86rem;
    opacity: 0;
    transform: translateY(-14px);
    transition: opacity 0.2s ease, transform 0.2s ease;
}

.toast-message.show {
    opacity: 1;
    transform: translateY(0);
}

.spinner {
    width: 1.35rem;
    height: 1.35rem;
    border: 3px solid #E2E8F0;
    border-top-color: var(--ink-black);
    border-radius: 50%;
    display: inline-block;
    animation: spinner-border 0.75s linear infinite;
    vertical-align: middle;
}

@keyframes spinner-border {
    to { transform: rotate(360deg); }
}

@media (max-width: 992px) {
    .sidebar { transform: translateX(calc(-1 * var(--sidebar-width))); }
    .sidebar.active { transform: translateX(0); }
    .content-wrapper { width: 100%; margin-left: 0; }
    .sidebar-toggle-btn { display: grid; }
}

@media (max-width: 640px) {
    .main-content, .topbar { padding: 0.9rem; }
    .page-heading { font-size: 1.8rem; }
    .detail-grid { grid-template-columns: 1fr; gap: 0.35rem; }
    .card-header { flex-direction: column; align-items: stretch; }
    .search-bar input { min-width: 0; width: 100%; }
}
</style>
</head>
<body>
<div id="toast-container"></div>
<div class="modal-overlay" id="modalOverlay"></div>
<div class="page-wrapper">
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="brand-lockup">
                <div class="brand-badge"><i class="bi bi-lightning-charge-fill"></i></div>
                <div>
                    <div class="brand-text">FelixTopUp</div>
                    <span class="brand-sub">Comic Admin HQ</span>
                </div>
            </div>
        </div>
        <ul class="sidebar-nav">
            <li class="nav-item"><a class="nav-link" href="/admin/dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
            <li class="nav-item"><a class="nav-link active" href="/admin/users"><i class="bi bi-people-fill"></i> Global User</a></li>
            <li class="nav-item"><a class="nav-link" href="/admin/deposit"><i class="bi bi-wallet2"></i> Global Deposit</a></li>
            <li class="nav-item"><a class="nav-link" href="/admin/order"><i class="bi bi-cart-check-fill"></i> Global Order</a></li>
            <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-clipboard-data-fill"></i> Rekap Transaksi</a></li>
            <li class="nav-item logout"><a class="nav-link" href="/auth/logout"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
        </ul>
    </nav>

    <div class="content-wrapper">
        <header class="topbar">
            <div class="topbar-left">
                <button class="sidebar-toggle-btn" id="sidebarToggleBtn" aria-label="Toggle Menu"><i class="bi bi-list"></i></button>
                <span class="comic-title" style="font-size: 1.3rem;">Manajemen Pengguna</span>
            </div>
            <span class="caption-tag" id="totalUsersBadge">0 Pengguna</span>
        </header>

        <main class="main-content">
            <div class="page-header">
                <h1 class="page-heading comic-title">
                    Daftar Semua Pengguna
                    <span class="caption-tag"><i class="bi bi-people-fill"></i> Compact View</span>
                </h1>
            </div>

            <div class="comic-panel" style="padding: 1rem;">
                <div class="card-header">
                    <h3 class="comic-title">Data User Rapat & Cepat</h3>
                    <div class="search-bar">
                        <i class="bi bi-search"></i>
                        <input type="text" id="searchInput" placeholder="Cari nama atau username...">
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="users-table">
                        <thead>
                            <tr>
                                <th style="width: 44px;">#</th>
                                <th>Pengguna</th>
                                <th>Saldo</th>
                                <th>H2H</th>
                                <th>OTP</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <tr>
                                <td colspan="6" style="text-align:center; padding: 2rem;">
                                    <span class="spinner"></span> Memuat data...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<div class="modal" id="userDetailsModal">
    <div class="modal-header">
        <h5 class="modal-title comic-title" id="userDetailsModalLabel">Detail Pengguna</h5>
        <button type="button" class="modal-close-btn" id="modalCloseBtn" aria-label="Tutup"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="modal-body" id="userDetailsModalBody"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    let allUsersData = [];
    const userModal = document.getElementById('userDetailsModal');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalCloseBtn = document.getElementById('modalCloseBtn');
    const sidebar = document.getElementById('sidebar');
    const sidebarToggleBtn = document.getElementById('sidebarToggleBtn');

    const toggleSidebar = () => {
        sidebar.classList.toggle('active');
        modalOverlay.classList.toggle('active');
    };
    sidebarToggleBtn.addEventListener('click', toggleSidebar);
    sidebar.addEventListener('click', (e) => e.stopPropagation());

    const closeModal = () => {
        userModal.classList.remove('active');
        if (!sidebar.classList.contains('active')) modalOverlay.classList.remove('active');
    };
    window.closeModal = closeModal;

    modalOverlay.addEventListener('click', () => {
        if (sidebar.classList.contains('active')) toggleSidebar();
        if (userModal.classList.contains('active')) closeModal();
    });
    modalCloseBtn.addEventListener('click', closeModal);

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && userModal.classList.contains('active')) closeModal();
    });

    const formatRupiah = (n) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(n || 0);
    const formatDate = (d) => d ? new Date(d).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }) : '-';

    const escapeHtml = (str) => {
        if (str === null || str === undefined) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    };

    const showToast = (message, isSuccess = true) => {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'toast-message';
        toast.textContent = message;
        toast.style.backgroundColor = isSuccess ? 'var(--c-green)' : 'var(--c-red)';
        toast.style.color = '#FFFFFF';
        container.appendChild(toast);
        setTimeout(() => toast.classList.add('show'), 10);
        setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => toast.remove(), 220);
        }, 2800);
    };

    const checkOtpStatus = async (username) => {
        try {
            const response = await fetch(`/admin/user/otp-status?username=${encodeURIComponent(username)}`);
            const result = await response.json();
            if (result.success) return result.data;
            throw new Error(result.message);
        } catch (error) {
            console.error('Error checking OTP status:', error);
            return null;
        }
    };

    const getOtpHistory = async (username) => {
        try {
            const response = await fetch(`/admin/user/otp-history?username=${encodeURIComponent(username)}`);
            const result = await response.json();
            if (result.success) return result.data;
            throw new Error(result.message);
        } catch (error) {
            console.error('Error getting OTP history:', error);
            return [];
        }
    };

    const clearActiveOtp = async (username) => {
        if (!confirm(`Hapus OTP aktif untuk user ${username}?`)) return;
        try {
            const response = await fetch('/admin/user/clear-otp', {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username })
            });
            const result = await response.json();
            if (!result.success) throw new Error(result.message);
            showToast(result.message, true);
            await refreshOtpStatus(username);
        } catch (error) {
            showToast(error.message, false);
        }
    };
    window.clearActiveOtp = clearActiveOtp;

    const refreshOtpStatus = async (username) => {
        const otpCell = document.getElementById(`otp-status-${username}`);
        if (!otpCell) return;

        try {
            const response = await fetch(`/admin/user/otp-status?username=${encodeURIComponent(username)}`);
            const result = await response.json();
            if (result.success && result.data) {
                const otpData = result.data;
                if (otpData.hasOtp) {
                    otpCell.innerHTML = `
                        <div class="otp-compact-inline">
                            <span class="otp-mini-code" title="Aktivitas: ${escapeHtml(otpData.aktifitas || '-')} | Sisa: ${escapeHtml(otpData.waktuSisaMenit ?? '-')}m">${escapeHtml(otpData.otpCode)}</span>
                            <span style="font-size:0.72rem; color:var(--ink-muted);">${escapeHtml(otpData.waktuSisaMenit ?? 0)}m</span>
                            <button type="button" class="otp-mini-del" onclick="clearActiveOtp('${escapeHtml(username)}')" title="Hapus OTP"><i class="bi bi-x"></i></button>
                        </div>
                    `;
                } else {
                    otpCell.innerHTML = `<span style="font-size:0.75rem; font-weight:700; color:var(--ink-muted);">—</span>`;
                }
            } else {
                otpCell.innerHTML = `<span class="status-badge status-failed">Err</span>`;
            }
        } catch (error) {
            otpCell.innerHTML = `<span class="status-badge status-failed">Err</span>`;
        }
    };

    const renderTable = (users) => {
        const tableBody = document.getElementById('usersTableBody');
        document.getElementById('totalUsersBadge').textContent = `${users.length} Pengguna`;

        if (!users || users.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; padding: 2rem; font-weight:700;">Pengguna tidak ditemukan.</td></tr>`;
            return;
        }

        tableBody.innerHTML = users.map((user, index) => {
            const realIndex = allUsersData.indexOf(user);
            return `
                <tr>
                    <td><strong>${index + 1}</strong></td>
                    <td>
                        <div class="user-cell-main">${escapeHtml(user.fullname || '-')}</div>
                        <div class="user-cell-sub">@${escapeHtml(user.username || '-')}</div>
                    </td>
                    <td><strong>${formatRupiah(user.saldo)}</strong></td>
                    <td>
                        ${user.isVerified
                            ? `<span class="status-badge status-success"><i class="bi bi-check"></i> Aktif</span>`
                            : `<span class="status-badge status-failed"><i class="bi bi-x"></i> Off</span>`}
                    </td>
                    <td id="otp-status-${escapeHtml(user.username)}">
                        <span class="spinner" style="width: 0.9rem; height: 0.9rem; border-width: 2px;"></span>
                    </td>
                    <td>
                        <div class="row-actions-compact">
                            <button type="button" class="action-btn view-details-btn" data-user-index="${realIndex}" title="Detail"><i class="bi bi-eye-fill"></i> Detail</button>
                            <button type="button" class="action-btn edit-btn edit-user-btn" data-user-index="${realIndex}" title="Edit"><i class="bi bi-pencil-fill"></i></button>
                            <button type="button" class="action-btn delete-btn delete-user-btn" data-username="${escapeHtml(user.username)}" title="Hapus"><i class="bi bi-trash-fill"></i></button>
                        </div>
                    </td>
                </tr>
            `;
        }).join('');

        users.forEach(user => refreshOtpStatus(user.username));

        document.querySelectorAll('.view-details-btn').forEach(btn => {
            btn.addEventListener('click', (e) => displayUserDetails(allUsersData[e.currentTarget.dataset.userIndex]));
        });
        document.querySelectorAll('.edit-user-btn').forEach(btn => {
            btn.addEventListener('click', (e) => editUser(allUsersData[e.currentTarget.dataset.userIndex]));
        });
        document.querySelectorAll('.delete-user-btn').forEach(btn => {
            btn.addEventListener('click', (e) => deleteUser(e.currentTarget.dataset.username));
        });
    };

    const toggleVerification = async (username) => {
        try {
            const response = await fetch('/admin/user/toggle-verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username })
            });
            const result = await response.json();
            if (!result.success) throw new Error(result.message);
            showToast(result.message, true);
            const user = allUsersData.find(u => u.username === username);
            if (user && result.data) user.isVerified = result.data.isVerified;
            renderTable(allUsersData);
            return true;
        } catch (error) {
            showToast(error.message, false);
            return false;
        }
    };

    const editUser = (user) => {
        document.getElementById('userDetailsModalLabel').textContent = `Edit Pengguna: ${user.username}`;
        document.getElementById('userDetailsModalBody').innerHTML = `
            <div class="rekap-box" style="margin-top:0;">
                <h4 class="comic-title" style="margin:0 0 0.9rem; font-size:1.2rem;">Edit Data Pengguna</h4>
                <form id="editUserForm">
                    <div class="form-group">
                        <label for="editFullname">Nama Lengkap</label>
                        <input type="text" id="editFullname" value="${escapeHtml(user.fullname || '')}" required>
                    </div>
                    <div class="form-group">
                        <label for="editUsername">Username</label>
                        <input type="text" id="editUsername" value="${escapeHtml(user.username || '')}" required>
                    </div>
                    <div class="form-group">
                        <label for="editEmail">Email</label>
                        <input type="email" id="editEmail" value="${escapeHtml(user.email || '')}" required>
                    </div>
                    <div class="form-group">
                        <label for="editNomor">Nomor Telepon</label>
                        <input type="text" id="editNomor" value="${escapeHtml(user.nomor || '')}">
                    </div>
                    <div class="form-group">
                        <label for="editRole">Role</label>
                        <select id="editRole" required>
                            <option value="user" ${user.role === 'user' ? 'selected' : ''}>User</option>
                            <option value="admin" ${user.role === 'admin' ? 'selected' : ''}>Admin</option>
                            <option value="reseller" ${user.role === 'reseller' ? 'selected' : ''}>Reseller</option>
                        </select>
                    </div>
                    <div style="display: flex; gap: 0.5rem; margin-top: 1.1rem;">
                        <button type="button" class="action-btn" onclick="closeModal()" style="background-color: var(--c-slate);">Batal</button>
                        <button type="submit" class="save-btn"><i class="bi bi-save-fill"></i> Simpan Perubahan</button>
                    </div>
                </form>
            </div>
        `;

        document.getElementById('editUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const updatedData = {
                username: user.username,
                fullname: document.getElementById('editFullname').value,
                newUsername: document.getElementById('editUsername').value,
                email: document.getElementById('editEmail').value,
                nomor: document.getElementById('editNomor').value,
                role: document.getElementById('editRole').value
            };

            try {
                const response = await fetch('/admin/user/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updatedData)
                });
                const result = await response.json();
                if (!result.success) throw new Error(result.message);
                showToast(result.message, true);

                const userIndex = allUsersData.findIndex(u => u.username === user.username);
                if (userIndex !== -1) {
                    allUsersData[userIndex] = {
                        ...allUsersData[userIndex],
                        fullname: updatedData.fullname,
                        username: updatedData.newUsername,
                        email: updatedData.email,
                        nomor: updatedData.nomor,
                        role: updatedData.role
                    };
                }
                renderTable(allUsersData);
                closeModal();
            } catch (error) {
                showToast(error.message, false);
            }
        });

        userModal.classList.add('active');
        modalOverlay.classList.add('active');
    };

    const deleteUser = async (username) => {
        if (!confirm(`Hapus user "${username}" secara permanen?`)) return;
        try {
            const response = await fetch('/admin/user/delete', {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username })
            });
            const result = await response.json();
            if (!result.success) throw new Error(result.message);
            showToast(result.message, true);
            allUsersData = allUsersData.filter(u => u.username !== username);
            renderTable(allUsersData);
        } catch (error) {
            showToast(error.message, false);
        }
    };

    const displayUserDetails = async (user) => {
        document.getElementById('userDetailsModalLabel').textContent = `Detail: ${user.username}`;
        const totalDepositSuccess = (user.historyDeposit || []).filter(d => d.status === 'success').reduce((sum, d) => sum + (d.get_balance || 0), 0);
        const totalOrderSuccess = (user.historyOrder || []).filter(o => o.status === 'success').reduce((sum, o) => sum + (parseFloat(o.price) || 0), 0);

        const otpData = await checkOtpStatus(user.username);
        const otpHistory = await getOtpHistory(user.username);

        document.getElementById('userDetailsModalBody').innerHTML = `
            <div class="modal-tabs">
                <button type="button" class="tab-btn active" data-tab="info">Info & Aksi</button>
                <button type="button" class="tab-btn" data-tab="deposit">Deposit (${(user.historyDeposit || []).length})</button>
                <button type="button" class="tab-btn" data-tab="order">Order (${(user.historyOrder || []).length})</button>
                <button type="button" class="tab-btn" data-tab="otp">Riwayat OTP (${otpHistory.length})</button>
            </div>
            <div id="info" class="tab-content active">
                <dl class="detail-grid">
                    <dt>Nama</dt><dd>${escapeHtml(user.fullname || '-')}</dd>
                    <dt>Username</dt><dd>@${escapeHtml(user.username || '-')}</dd>
                    <dt>Email</dt><dd>${escapeHtml(user.email || '-')}</dd>
                    <dt>Telepon</dt><dd>${escapeHtml(user.nomor || '-')}</dd>
                    <dt>Role</dt><dd style="text-transform: uppercase;">${escapeHtml(user.role || 'user')}</dd>
                    <dt>Daftar</dt><dd>${formatDate(user.tanggalDaftar)}</dd>
                    <dt>Verifikasi H2H</dt>
                    <dd>
                        ${user.isVerified
                            ? '<span class="status-badge status-success">Aktif</span>'
                            : '<span class="status-badge status-failed">Tidak Aktif</span>'}
                        <button type="button" class="action-btn ${user.isVerified ? 'unverify-btn' : 'verify-btn'}" style="margin-left:0.5rem;" onclick="toggleVerificationFromModal('${escapeHtml(user.username)}')">
                            <i class="bi ${user.isVerified ? 'bi-x-circle' : 'bi-patch-check'}"></i> ${user.isVerified ? 'Nonaktifkan' : 'Aktifkan'}
                        </button>
                    </dd>
                    <dt>OTP Aktif</dt>
                    <dd>
                        ${otpData && otpData.hasOtp ? `
                            <div class="rekap-box" style="margin-top:0; padding:0.75rem;">
                                <div class="otp-code" style="text-align:center; margin-bottom:0.5rem;">${escapeHtml(otpData.otpCode)}</div>
                                <div style="font-size:0.8rem;">Aktivitas: <b>${escapeHtml(otpData.aktifitas || '-')}</b> • Sisa: <b>${escapeHtml(otpData.waktuSisaMenit ?? 0)}m</b></div>
                                <button type="button" class="action-btn delete-btn" style="margin-top:0.5rem;" onclick="clearActiveOtpFromModal('${escapeHtml(user.username)}')">
                                    <i class="bi bi-trash"></i> Hapus OTP
                                </button>
                            </div>
                        ` : `<span style="color:var(--ink-muted);">Tidak ada OTP aktif</span>`}
                    </dd>
                </dl>

                <div class="rekap-box">
                    <h4 class="comic-title" style="margin:0 0 0.65rem; font-size:1.15rem;">Rekapan Finansial</h4>
                    <dl class="detail-grid">
                        <dt>Saldo</dt><dd>${formatRupiah(user.saldo)}</dd>
                        <dt>Coin</dt><dd>${escapeHtml(user.coin || 0)}</dd>
                        <dt>Deposit Sukses</dt><dd>${formatRupiah(totalDepositSuccess)}</dd>
                        <dt>Order Sukses</dt><dd>${formatRupiah(totalOrderSuccess)}</dd>
                    </dl>
                </div>

                <div class="rekap-box" style="background:#FEFCE8;">
                    <h4 class="comic-title" style="margin:0 0 0.65rem; font-size:1.15rem;">Edit Saldo & Coin</h4>
                    <form id="editBalanceForm">
                        <div class="form-group"><label for="newSaldo">Saldo Baru</label><input type="number" id="newSaldo" value="${escapeHtml(user.saldo || 0)}" step="1"></div>
                        <div class="form-group"><label for="newCoin">Coin Baru</label><input type="number" id="newCoin" value="${escapeHtml(user.coin || 0)}" step="1"></div>
                        <button type="submit" class="save-btn"><i class="bi bi-save-fill"></i> Simpan Saldo & Coin</button>
                    </form>
                </div>

                <div class="rekap-box" style="background:var(--c-red-soft);">
                    <h4 class="comic-title" style="margin:0 0 0.35rem; font-size:1.15rem; color:#991B1B;">Zona Berbahaya</h4>
                    <p style="margin:0 0 0.7rem; font-size:0.84rem; font-weight:700; color:#7F1D1D;">Menghapus user tidak bisa dibatalkan.</p>
                    <button type="button" class="action-btn delete-btn" onclick="deleteUserFromModal('${escapeHtml(user.username)}')">
                        <i class="bi bi-trash-fill"></i> Hapus User Ini
                    </button>
                </div>
            </div>
            <div id="deposit" class="tab-content">${renderHistoryTable(user.historyDeposit, ['ID', 'Metode', 'Nominal', 'Saldo Diterima', 'Status'])}</div>
            <div id="order" class="tab-content">${renderHistoryTable(user.historyOrder, ['ID', 'Layanan', 'Target', 'Harga', 'Status'])}</div>
            <div id="otp" class="tab-content">${renderOtpHistory(otpHistory)}</div>
        `;

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tab-btn, .tab-content').forEach(el => el.classList.remove('active'));
                e.target.classList.add('active');
                document.getElementById(e.target.dataset.tab).classList.add('active');
            });
        });

        document.getElementById('editBalanceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newSaldo = document.getElementById('newSaldo').value;
            const newCoin = document.getElementById('newCoin').value;
            try {
                const response = await fetch('/admin/user/update-balance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user.username, newSaldo, newCoin })
                });
                const result = await response.json();
                if (!result.success) throw new Error(result.message);
                showToast(result.message, true);
                if (result.data) {
                    user.saldo = result.data.saldo;
                    user.coin = result.data.coin;
                }
                renderTable(allUsersData);
                closeModal();
            } catch (error) {
                showToast(error.message, false);
            }
        });

        userModal.classList.add('active');
        modalOverlay.classList.add('active');
    };

    const renderOtpHistory = (otpHistory) => {
        if (!otpHistory || otpHistory.length === 0) {
            return `<p style="text-align:center; color: var(--ink-muted); font-weight:700; padding: 2rem 0;">Tidak ada riwayat OTP.</p>`;
        }
        return otpHistory.map(otp => `
            <div class="otp-history-item">
                <div class="otp-history-header">
                    <span class="otp-code-display">${escapeHtml(otp.otpCode)}</span>
                    <span class="status-badge ${otp.isExpired ? 'status-failed' : 'status-success'}">${otp.isExpired ? 'Expired' : 'Active'}</span>
                </div>
                <div style="font-size:0.84rem; font-weight:700;">
                    <div>Aktivitas: ${escapeHtml(otp.aktifitas || '-')} • Nomor: ${escapeHtml(otp.nomor || '-')}</div>
                    <div>Dibuat: ${formatDate(otp.createdAt)} • Exp: ${formatDate(otp.expiresAt)}</div>
                </div>
            </div>
        `).join('');
    };

    window.toggleVerificationFromModal = async (username) => {
        if (await toggleVerification(username)) closeModal();
    };
    window.deleteUserFromModal = (username) => {
        closeModal();
        deleteUser(username);
    };
    window.clearActiveOtpFromModal = async (username) => {
        await clearActiveOtp(username);
        closeModal();
    };

    const renderHistoryTable = (history, headers) => {
        if (!history || history.length === 0) {
            return `<p style="text-align:center; color: var(--ink-muted); font-weight:700; padding: 2rem 0;">Tidak ada riwayat.</p>`;
        }
        const isDeposit = headers.includes('Saldo Diterima');
        return `
            <div class="table-responsive">
                <table class="users-table">
                    <thead><tr>${headers.map(h => `<th>${escapeHtml(h)}</th>`).join('')}</tr></thead>
                    <tbody>
                        ${history.slice().reverse().map(item => `
                            <tr>
                                <td>${escapeHtml(item.id)}</td>
                                <td>${escapeHtml(isDeposit ? item.metode : item.layanan)}</td>
                                <td>${isDeposit ? formatRupiah(item.nominal) : escapeHtml(item.target)}</td>
                                <td>${isDeposit ? formatRupiah(item.get_balance) : formatRupiah(item.price)}</td>
                                <td><span class="status-badge status-${escapeHtml((item.status || '').toLowerCase())}">${escapeHtml(item.status)}</span></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        `;
    };

    document.getElementById('searchInput').addEventListener('input', (e) => {
        const searchTerm = e.target.value.toLowerCase();
        const filteredUsers = allUsersData.filter(user =>
            (user.fullname || '').toLowerCase().includes(searchTerm) ||
            (user.username || '').toLowerCase().includes(searchTerm)
        );
        renderTable(filteredUsers);
    });

    const loadPage = async () => {
        try {
            const response = await fetch('/admin/data/users');
            const users = await response.json();
            allUsersData = Array.isArray(users) ? users : [];
            renderTable(allUsersData);
        } catch (error) {
            console.error('Gagal mengambil data pengguna:', error);
            document.getElementById('usersTableBody').innerHTML = `<tr><td colspan="6" style="text-align:center; padding: 2rem; color:#991B1B; font-weight:800;">Gagal memuat data. Periksa koneksi dan coba lagi.</td></tr>`;
        }
    };

    loadPage();
});
</script>
</body>
</html>
