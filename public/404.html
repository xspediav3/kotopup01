<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#073d3a">
  <title>404 - Halaman Tidak Ditemukan</title>
  <link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style/404/404.css?v=2">
</head>
<body>
  <main class="scene-container">
    <div class="moon" aria-hidden="true">
      <span class="moon__crater moon__crater1"></span>
      <span class="moon__crater moon__crater2"></span>
      <span class="moon__crater moon__crater3"></span>
    </div>

    <div class="stars" aria-hidden="true">
      <i class="star star1"></i><i class="star star2"></i>
      <i class="star star3"></i><i class="star star4"></i>
      <i class="star star5"></i><i class="star star6"></i>
      <i class="star star7"></i>
    </div>

    <section class="content-wrapper">
      <div class="error">
        <div class="error__eyebrow">ANEMO • PAGE NOT FOUND</div>
        <h1 class="error__title">404</h1>
        <p class="error__subtitle">Hmmm... Halaman Tidak Ditemukan.</p>
        <p class="error__description">Sepertinya Xiao tersesat mencari halaman ini.</p>
        <div class="error__buttons-container">
          <button class="error__button error__button--active" type="button" onclick="goHome()">Back to Home</button>
          <button class="error__button" type="button" onclick="reportIssue()">Dashboard</button>
        </div>
      </div>

      <div class="xiao" role="img" aria-label="Maskot chibi Xiao dengan rambut hitam kehijauan dan tubuh sixpack">
        <div class="xiao__aura"></div>
        <div class="xiao__hair-back"></div>
        <div class="xiao__body">
          <div class="xiao__neck"></div>
          <div class="xiao__torso">
            <div class="xiao__chest xiao__chest--left"></div>
            <div class="xiao__chest xiao__chest--right"></div>
            <div class="xiao__abs">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
            <div class="xiao__tattoo"></div>
          </div>
          <div class="xiao__arm xiao__arm--left"></div>
          <div class="xiao__arm xiao__arm--right"></div>
          <div class="xiao__waist"></div>
          <div class="xiao__pants"></div>
        </div>
        <div class="xiao__face">
          <div class="xiao__hair-fringe xiao__hair-fringe--one"></div>
          <div class="xiao__hair-fringe xiao__hair-fringe--two"></div>
          <div class="xiao__brow xiao__brow--left"></div>
          <div class="xiao__brow xiao__brow--right"></div>
          <div class="xiao__eye xiao__eye--left"><i></i></div>
          <div class="xiao__eye xiao__eye--right"><i></i></div>
          <div class="xiao__nose"></div>
          <div class="xiao__mouth"></div>
          <div class="xiao__mark"></div>
        </div>
        <div class="xiao__hair-top"></div>
        <div class="xiao__hair-lock xiao__hair-lock--left"></div>
        <div class="xiao__hair-lock xiao__hair-lock--right"></div>
        <div class="xiao__glove xiao__glove--left"></div>
        <div class="xiao__glove xiao__glove--right"></div>
        <div class="xiao__spark xiao__spark--one">✦</div>
        <div class="xiao__spark xiao__spark--two">✧</div>
      </div>
    </section>

    <canvas id="anemo" aria-hidden="true"></canvas>
  </main>
  <script src="/style/404/404.js?v=2" defer></script>
</body>
</html>
