<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Game & Layanan - Comic Edition</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Chakra+Petch:wght@600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --comic-ink: #111827;
            --comic-green: #22c55e;
            --comic-green-dark: #15803d;
            --comic-yellow: #fde047;
            --comic-cyan: #38bdf8;
            --comic-bg: #f0fdf4;
            --comic-card: #ffffff;
            --comic-text: #111827;
            --comic-muted: #374151;
            --comic-dot: rgba(21, 128, 61, 0.14);
            --comic-shadow: 5px 5px 0px #111827;
            --comic-shadow-lg: 7px 7px 0px #111827;
        }

        [data-theme="dark"] {
            --comic-bg: #0f1c14;
            --comic-card: #18291e;
            --comic-text: #f3f4f6;
            --comic-muted: #cbd5e1;
            --comic-dot: rgba(74, 222, 128, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Manrope', sans-serif;
            color: var(--comic-text);
            background-color: var(--comic-bg);
            background-image: radial-gradient(var(--comic-dot) 1.5px, transparent 1.5px);
            background-size: 16px 16px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .comic-display {
            font-family: 'Bangers', cursive;
            letter-spacing: 1.2px;
        }

        .comic-heading {
            font-family: 'Chakra Petch', sans-serif;
            font-weight: 700;
        }

        /* Topbar Komik */
        .comic-topbar {
            background: var(--comic-card);
            border-bottom: 3px solid var(--comic-ink);
            padding: 0.8rem 0;
            position: sticky;
            top: 0;
            z-index: 1030;
            box-shadow: 0 4px 0 var(--comic-ink);
        }

        .comic-btn-nav {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.45rem 0.9rem;
            border: 2.5px solid var(--comic-ink);
            border-radius: 10px;
            background: var(--comic-yellow);
            color: #111827;
            font-family: 'Chakra Petch', sans-serif;
            font-weight: 700;
            font-size: 0.88rem;
            text-decoration: none;
            box-shadow: 3px 3px 0 var(--comic-ink);
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }

        .comic-btn-nav:hover {
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0 var(--comic-ink);
            color: #111827;
            background: #facc15;
        }

        .comic-btn-nav:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 var(--comic-ink);
        }

        .comic-title-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: var(--comic-green);
            color: #ffffff;
            border: 2.5px solid var(--comic-ink);
            border-radius: 999px;
            padding: 0.2rem 0.85rem;
            box-shadow: 3px 3px 0 var(--comic-ink);
            text-shadow: 1.5px 1.5px 0 var(--comic-ink);
        }

        /* Hero / Search Panel */
        .comic-hero-panel {
            background: var(--comic-card);
            border: 3px solid var(--comic-ink);
            border-radius: 16px;
            padding: 1.15rem 1.25rem;
            box-shadow: var(--comic-shadow);
            position: relative;
        }

        .comic-sfx-tag {
            position: absolute;
            top: -13px;
            right: 16px;
            background: #fb7185;
            color: #ffffff;
            border: 2.5px solid var(--comic-ink);
            border-radius: 8px;
            padding: 0.1rem 0.6rem;
            font-family: 'Bangers', cursive;
            font-size: 1rem;
            letter-spacing: 1px;
            transform: rotate(3deg);
            box-shadow: 2px 2px 0 var(--comic-ink);
        }

        .comic-search-wrap {
            display: flex;
            align-items: center;
            background: var(--comic-card);
            border: 3px solid var(--comic-ink);
            border-radius: 12px;
            box-shadow: 4px 4px 0 var(--comic-ink);
            overflow: hidden;
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }

        .comic-search-wrap:focus-within {
            transform: translate(-1px, -1px);
            box-shadow: 5px 5px 0 var(--comic-ink);
            background: #fefce8;
        }

        [data-theme="dark"] .comic-search-wrap:focus-within {
            background: #1e3326;
        }

        .comic-search-icon {
            padding: 0 0.9rem;
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--comic-green-dark);
        }

        [data-theme="dark"] .comic-search-icon {
            color: #4ade80;
        }

        .comic-search-input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            color: var(--comic-text);
            font-weight: 700;
            font-size: 0.95rem;
            padding: 0.72rem 0.85rem 0.72rem 0;
        }

        .comic-search-clear {
            border: none;
            background: transparent;
            color: var(--comic-muted);
            padding: 0 0.75rem;
            font-size: 1.05rem;
            cursor: pointer;
            display: none;
        }

        /* Grid & Comic Game Cards */
        .comic-game-grid {
            display: grid;
            /* Selalu tiga kartu dalam satu baris, termasuk pada layar HP. */
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 1rem;
        }

        .comic-alphabet-wrap {
            margin-top: 1rem;
            padding-top: 0.85rem;
            border-top: 1px dashed rgba(127, 127, 127, 0.35);
        }

        .comic-alphabet-title {
            display: block;
            margin-bottom: 0.55rem;
            color: var(--comic-muted);
            font-family: 'Chakra Petch', sans-serif;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.35px;
            text-transform: uppercase;
        }

        .comic-alphabet-grid {
            display: grid;
            grid-template-columns: repeat(14, minmax(0, 1fr));
            gap: 0.4rem;
        }

        .comic-letter-btn {
            min-width: 0;
            min-height: 34px;
            padding: 0.3rem 0.15rem;
            border: 2px solid var(--comic-ink);
            border-radius: 8px;
            background: var(--comic-card);
            color: var(--comic-text);
            box-shadow: 2px 2px 0 var(--comic-ink);
            font-family: 'Chakra Petch', sans-serif;
            font-size: 0.76rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
        }

        .comic-letter-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0 var(--comic-ink);
        }

        .comic-letter-btn.active {
            background: var(--comic-green);
            color: #ffffff;
            text-shadow: 1px 1px 0 var(--comic-ink);
        }

        .comic-game-card {
            background: var(--comic-card);
            border: 3px solid var(--comic-ink);
            border-radius: 16px;
            padding: 1.1rem 0.95rem;
            text-decoration: none;
            color: var(--comic-text);
            box-shadow: var(--comic-shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            text-align: center;
            position: relative;
            transition: transform 0.14s ease, box-shadow 0.14s ease, background-color 0.14s ease;
        }

        .comic-game-card:hover {
            transform: translate(-3px, -3px);
            box-shadow: var(--comic-shadow-lg);
            color: var(--comic-text);
            background: #f0fdf4;
        }

        [data-theme="dark"] .comic-game-card:hover {
            background: #1f3627;
        }

        .comic-game-card:active {
            transform: translate(3px, 3px);
            box-shadow: 2px 2px 0 var(--comic-ink);
        }

        .comic-avatar-box {
            width: 66px;
            height: 66px;
            border-radius: 16px;
            border: 2.5px solid var(--comic-ink);
            background: linear-gradient(135deg, #4ade80 0%, #16a34a 100%);
            box-shadow: 3px 3px 0 var(--comic-ink);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.85rem;
            color: #ffffff;
            margin-bottom: 0.8rem;
            overflow: hidden;
        }

        .comic-avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .comic-game-title {
            font-family: 'Chakra Petch', sans-serif;
            font-weight: 700;
            font-size: 0.98rem;
            line-height: 1.25;
            margin-bottom: 0.55rem;
            word-break: break-word;
        }

        .comic-badges {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.35rem;
        }

        .comic-pill {
            font-family: 'Chakra Petch', sans-serif;
            font-weight: 700;
            font-size: 0.7rem;
            padding: 0.18rem 0.55rem;
            border-radius: 7px;
            border: 2px solid var(--comic-ink);
            box-shadow: 2px 2px 0 var(--comic-ink);
        }

        .comic-pill-green {
            background: #bbf7d0;
            color: #14532d;
        }

        .comic-pill-cyan {
            background: #bae6fd;
            color: #0c4a6e;
        }

        .comic-empty-box {
            grid-column: 1 / -1;
            background: var(--comic-card);
            border: 3px solid var(--comic-ink);
            border-radius: 16px;
            padding: 2.5rem 1.25rem;
            text-align: center;
            box-shadow: var(--comic-shadow);
        }

        @media (max-width: 575.98px) {
            .comic-game-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 0.55rem;
            }
            .comic-game-card {
                min-width: 0;
                min-height: 145px;
                padding: 0.7rem 0.35rem;
                border-width: 2px;
                border-radius: 12px;
                box-shadow: 3px 3px 0 var(--comic-ink);
            }
            .comic-avatar-box {
                width: 50px;
                height: 50px;
                margin-bottom: 0.55rem;
                border-width: 2px;
                border-radius: 12px;
                font-size: 1.35rem;
            }
            .comic-game-title {
                font-size: 0.72rem;
                line-height: 1.2;
                margin-bottom: 0.45rem;
                overflow-wrap: anywhere;
            }
            .comic-badges {
                gap: 0.22rem;
            }
            .comic-pill {
                padding: 0.13rem 0.3rem;
                border-width: 1px;
                font-size: 0.56rem;
                box-shadow: 1px 1px 0 var(--comic-ink);
            }
            .comic-alphabet-grid {
                grid-template-columns: repeat(9, minmax(0, 1fr));
                gap: 0.32rem;
            }
            .comic-letter-btn {
                min-height: 31px;
                padding: 0.2rem 0.05rem;
                font-size: 0.68rem;
                border-width: 1.5px;
                box-shadow: 1.5px 1.5px 0 var(--comic-ink);
            }
        }
    </style>
</head>
<body data-theme="light">
    <header class="comic-topbar">
        <div class="container d-flex align-items-center justify-content-between gap-2">
            <a href="/dashboard" class="comic-btn-nav">
                <i class="bi bi-arrow-left-circle-fill"></i>
                <span>Dashboard</span>
            </a>
            <div class="comic-title-badge text-truncate">
                <i class="bi bi-controller"></i>
                <span id="judul" class="comic-display fs-5 text-truncate">DAFTAR GAME</span>
            </div>
            <div style="width: 96px;" class="d-none d-sm-block"></div>
        </div>
    </header>

    <main class="container py-4">
        <div class="comic-hero-panel mb-4">
            <span class="comic-sfx-tag">POW! TOPUP</span>
            <div class="row align-items-center g-3">
                <div class="col-lg-6">
                    <div class="comic-heading fs-6 text-uppercase mb-1">
                        <i class="bi bi-lightning-charge-fill text-warning"></i> Pilih Game Favoritmu
                    </div>
                    <p class="mb-0 small" style="color: var(--comic-muted); font-weight: 600;">
                        Klik kotak game untuk melihat daftar nominal, cek harga, dan langsung order instan.
                    </p>
                </div>
                <div class="col-lg-6">
                    <div class="comic-search-wrap">
                        <span class="comic-search-icon"><i class="bi bi-search"></i></span>
                        <input type="text" id="searchInput" class="comic-search-input" placeholder="Cari game (contoh: Mobile Legends, Free Fire)...">
                        <button type="button" id="clearSearchBtn" class="comic-search-clear" title="Hapus pencarian">
                            <i class="bi bi-x-circle-fill"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="comic-alphabet-wrap">
                <span class="comic-alphabet-title">Filter berdasarkan inisial nama game</span>
                <div id="alphabetFilter" class="comic-alphabet-grid" aria-label="Filter alfabet game"></div>
            </div>
        </div>

        <div id="produk-container" class="comic-game-grid">
            <div class="comic-empty-box">
                <div class="spinner-border text-success" role="status"></div>
                <p class="mt-2 mb-0 fw-bold">Memuat panel daftar game...</p>
            </div>
        </div>
    </main>

    <script>
        const savedTheme = localStorage.getItem('vp-theme') || 'light';
        document.body.setAttribute('data-theme', savedTheme);

        const params = new URLSearchParams(window.location.search);
        const category = params.get("category") || "Games";
        const initialSearch = params.get("search") || "";

        const judul = document.getElementById("judul");
        const searchInput = document.getElementById("searchInput");
        const clearSearchBtn = document.getElementById("clearSearchBtn");
        const alphabetFilter = document.getElementById("alphabetFilter");
        const container = document.getElementById("produk-container");

        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
        let allGamesData = [];
        let activeLetter = "ALL";

        judul.innerText = category ? `KATEGORI: ${category.toUpperCase()}` : "DAFTAR GAME";

        if (initialSearch) {
            searchInput.value = initialSearch;
            clearSearchBtn.style.display = "inline-flex";
        }

        function getGameName(item) {
            return String(item?.game || item?.provider || item?.name || "Unknown").trim();
        }

        // Dukung beberapa kemungkinan nama properti foto dari respons API.
        function getGameImage(item) {
            const candidates = [
                item?.img_url,
                item?.image_url,
                item?.imageUrl,
                item?.game_image,
                item?.gameImage,
                item?.icon_url,
                item?.icon,
                item?.logo_url,
                item?.logo,
                item?.thumbnail,
                item?.cover
            ];

            for (const candidate of candidates) {
                let value = candidate;
                if (candidate && typeof candidate === "object") {
                    value = candidate.url || candidate.src || candidate.href || candidate.original || "";
                }
                if (typeof value !== "string" || !value.trim()) continue;

                try {
                    const parsed = new URL(value.trim(), window.location.origin);
                    if (parsed.protocol === "http:" || parsed.protocol === "https:") {
                        return parsed.href;
                    }
                } catch (_) {
                    // Lewati URL gambar yang tidak valid.
                }
            }
            return "";
        }

        function showEmptyState(message = "Coba kata kunci atau huruf awal yang lain.") {
            container.innerHTML = "";
            const empty = document.createElement("div");
            empty.className = "comic-empty-box";

            const icon = document.createElement("i");
            icon.className = "bi bi-emoji-dizzy fs-1 text-danger";
            const title = document.createElement("div");
            title.className = "comic-heading fs-5 mt-2";
            title.textContent = "Game Tidak Ditemukan!";
            const description = document.createElement("p");
            description.className = "mt-1 mb-0 small";
            description.style.color = "var(--comic-muted)";
            description.textContent = message;

            empty.append(icon, title, description);
            container.appendChild(empty);
        }

        function addFallbackIcon(avatar) {
            const icon = document.createElement("i");
            icon.className = "bi bi-controller";
            icon.setAttribute("aria-hidden", "true");
            avatar.appendChild(icon);
        }

        function renderGames(list) {
            container.innerHTML = "";

            if (!Array.isArray(list) || list.length === 0) {
                showEmptyState();
                return;
            }

            list.forEach(item => {
                const gameName = getGameName(item);
                const productCount = Number(item?.products) || 0;
                const needZone = Boolean(item?.need_zone);
                const targetUrl = `/produk-harga?game=${encodeURIComponent(gameName)}&need_zone=${needZone ? "1" : "0"}`;

                const card = document.createElement("a");
                card.href = targetUrl;
                card.className = "comic-game-card";
                card.setAttribute("aria-label", `Lihat nominal ${gameName}`);

                const content = document.createElement("div");
                content.className = "w-100 d-flex flex-column align-items-center";

                const avatar = document.createElement("div");
                avatar.className = "comic-avatar-box";

                const imageUrl = getGameImage(item);
                if (imageUrl) {
                    const image = document.createElement("img");
                    image.src = imageUrl;
                    image.alt = gameName;
                    image.loading = "lazy";
                    image.decoding = "async";
                    image.addEventListener("error", () => {
                        image.remove();
                        addFallbackIcon(avatar);
                    }, { once: true });
                    avatar.appendChild(image);
                } else {
                    addFallbackIcon(avatar);
                }

                const title = document.createElement("div");
                title.className = "comic-game-title";
                title.textContent = gameName;
                content.append(avatar, title);

                const badges = document.createElement("div");
                badges.className = "comic-badges";

                const productBadge = document.createElement("span");
                productBadge.className = "comic-pill comic-pill-green";
                productBadge.textContent = productCount > 0 ? `${productCount} Item` : "Cek Harga";
                badges.appendChild(productBadge);

                if (needZone) {
                    const zoneBadge = document.createElement("span");
                    zoneBadge.className = "comic-pill comic-pill-cyan";
                    zoneBadge.textContent = "Zone ID";
                    badges.appendChild(zoneBadge);
                }

                card.append(content, badges);
                container.appendChild(card);
            });
        }

        function renderAlphabet() {
            alphabetFilter.innerHTML = "";
            const letters = ["ALL", ...alphabet];

            letters.forEach(letter => {
                const button = document.createElement("button");
                button.type = "button";
                button.className = `comic-letter-btn${activeLetter === letter ? " active" : ""}`;
                button.textContent = letter === "ALL" ? "ALL" : letter;
                button.setAttribute("aria-pressed", activeLetter === letter ? "true" : "false");
                button.setAttribute("aria-label", letter === "ALL" ? "Tampilkan semua game" : `Tampilkan game berawalan ${letter}`);
                button.addEventListener("click", () => {
                    activeLetter = letter;
                    renderAlphabet();
                    applySearchFilter();
                });
                alphabetFilter.appendChild(button);
            });
        }

        function applySearchFilter() {
            const keyword = searchInput.value.trim().toLocaleLowerCase("id-ID");
            clearSearchBtn.style.display = keyword ? "inline-flex" : "none";

            const filtered = allGamesData.filter(item => {
                const gameName = getGameName(item);
                const normalizedName = gameName.toLocaleLowerCase("id-ID");
                const matchesKeyword = !keyword || normalizedName.includes(keyword);
                const firstLetter = gameName.charAt(0).toLocaleUpperCase("id-ID");
                const matchesLetter = activeLetter === "ALL" || firstLetter === activeLetter;
                return matchesKeyword && matchesLetter;
            });

            renderGames(filtered);
        }

        async function loadProduk() {
            const url = new URL("/api/webtrx/produk", window.location.origin);
            if (category) url.searchParams.set("category", category);
            if (initialSearch) url.searchParams.set("search", initialSearch);

            try {
                const res = await fetch(url.toString(), {
                    method: "GET",
                    credentials: "same-origin",
                    headers: { "Accept": "application/json" }
                });

                if (!res.ok) {
                    throw new Error(`Server merespons HTTP ${res.status}`);
                }

                const json = await res.json();
                if (json?.success === false) {
                    throw new Error(json.message || "API gagal mengambil daftar game.");
                }

                const listData = Array.isArray(json.data)
                    ? json.data
                    : (Array.isArray(json.products) ? json.products : []);

                allGamesData = listData;
                renderAlphabet();
                applySearchFilter();
            } catch (err) {
                console.error("Gagal memuat daftar game:", err);
                container.innerHTML = `
                    <div class="comic-empty-box">
                        <i class="bi bi-exclamation-triangle-fill fs-1 text-danger"></i>
                        <div class="comic-heading fs-5 mt-2 text-danger">Gagal Memuat Daftar Game</div>
                        <p class="mt-1 mb-0 small" style="color: var(--comic-muted);">Periksa koneksi, sesi login, atau endpoint /api/webtrx/produk. ${String(err.message || "")}</p>
                    </div>
                `;
            }
        }

        searchInput.addEventListener("input", applySearchFilter);
        clearSearchBtn.addEventListener("click", () => {
            searchInput.value = "";
            applySearchFilter();
            searchInput.focus();
        });

        renderAlphabet();
        loadProduk();
    </script>
</body>
</html>
