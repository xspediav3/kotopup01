<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pilih Game Topup - POW! TOPUP</title>
  <style>
    :root {
      --bg: #eef7f0;
      --card: #ffffff;
      --card-alt: #e3f5e8;
      --ink: #13211a;
      --muted: #496054;
      --primary: #18a957;
      --primary-dark: #107d3f;
      --accent: #ff5d8f;
      --warn: #ffd447;
      --zone-bg: #d9eeff;
      --zone-ink: #0f4c81;
      --border: #13211a;
      --shadow: 4px 4px 0px #13211a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    .top-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border: 2.5px solid var(--border);
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.92rem;
      text-decoration: none;
      color: var(--ink);
      background: var(--warn);
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px var(--border);
    }

    .btn-green {
      background: var(--primary);
      color: #ffffff;
    }

    .hero-box {
      position: relative;
      background: var(--card);
      border: 3px solid var(--border);
      border-radius: 22px;
      padding: 20px;
      box-shadow: 6px 6px 0px var(--border);
      margin-bottom: 20px;
    }

    .badge-tag {
      position: absolute;
      top: -14px;
      right: 18px;
      background: var(--accent);
      color: #fff;
      font-weight: 800;
      font-size: 0.78rem;
      letter-spacing: 0.5px;
      padding: 5px 12px;
      border: 2.5px solid var(--border);
      border-radius: 999px;
      box-shadow: 3px 3px 0px var(--border);
      transform: rotate(2deg);
    }

    .hero-title {
      font-size: 1.3rem;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .hero-sub {
      color: var(--muted);
      font-size: 0.94rem;
      margin-bottom: 14px;
    }

    .search-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input {
      width: 100%;
      padding: 12px 42px 12px 16px;
      border: 2.5px solid var(--border);
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 600;
      background: #f9fffb;
      color: var(--ink);
      outline: none;
    }

    .search-input:focus {
      background: #ffffff;
      box-shadow: 3px 3px 0px var(--border);
    }

    .clear-btn {
      position: absolute;
      right: 10px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: #e5e9e7;
      color: var(--ink);
      font-weight: 800;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .clear-btn.show {
      display: inline-flex;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--muted);
    }

    .grid-games {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 16px;
    }

    .game-card {
      background: var(--card);
      border: 2.5px solid var(--border);
      border-radius: 20px;
      padding: 16px 14px;
      box-shadow: 5px 5px 0px var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
    }

    .game-card:nth-child(odd) {
      background: var(--card-alt);
    }

    .game-card:hover {
      transform: translate(-2px, -2px);
      box-shadow: 7px 7px 0px var(--border);
    }

    .game-card:active {
      transform: translate(2px, 2px);
      box-shadow: 3px 3px 0px var(--border);
    }

    .icon-box {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      background: var(--primary);
      border: 2.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      overflow: hidden;
      box-shadow: 3px 3px 0px var(--border);
    }

    .icon-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .icon-fallback {
      color: #ffffff;
      font-weight: 900;
      font-size: 1.35rem;
      letter-spacing: 0.5px;
    }

    .game-name {
      font-size: 1rem;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 10px;
      word-break: break-word;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-top: auto;
    }

    .chip {
      font-size: 0.76rem;
      font-weight: 800;
      padding: 4px 9px;
      border-radius: 9px;
      border: 2px solid var(--border);
    }

    .chip-item {
      background: #c8f5d6;
      color: #0d4a26;
    }

    .chip-zone {
      background: var(--zone-bg);
      color: var(--zone-ink);
    }

    .chip-nozone {
      background: #f3f4f6;
      color: #374151;
    }

    .message-box {
      grid-column: 1 / -1;
      background: var(--card);
      border: 2.5px solid var(--border);
      border-radius: 18px;
      padding: 28px 20px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .message-box p {
      margin-top: 8px;
      color: var(--muted);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-nav">
      <a href="/dashboard" class="btn">&larr; Dashboard</a>
      <span class="btn btn-green">KATEGORI: GAMES</span>
    </div>

    <section class="hero-box">
      <div class="badge-tag">POW! TOPUP</div>
      <h1 class="hero-title">&#9889; PILIH GAME FAVORITMU</h1>
      <p class="hero-sub">Klik kotak game untuk melihat daftar nominal, cek harga, dan langsung order instan.</p>

      <div class="search-wrap">
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Cari nama game (contoh: Mobile Legends, Free Fire, Magic)..."
          autocomplete="off"
        />
        <button type="button" id="clearSearchBtn" class="clear-btn" title="Hapus pencarian">&times;</button>
      </div>
    </section>

    <div class="status-bar">
      <span id="gameCountText">Memuat daftar game...</span>
      <span id="providerBadge">Provider: Ditznesia</span>
    </div>

    <div id="gamesGrid" class="grid-games">
      <div class="message-box">
        <strong>Memuat data game...</strong>
        <p>Mengambil daftar game dari server.</p>
      </div>
    </div>
  </div>

  <script>
    const gamesGrid = document.getElementById("gamesGrid");
    const searchInput = document.getElementById("searchInput");
    const clearSearchBtn = document.getElementById("clearSearchBtn");
    const gameCountText = document.getElementById("gameCountText");

    let allGames = [];

    function getInitials(name = "") {
      const words = String(name).trim().split(/\s+/).filter(Boolean);
      if (!words.length) return "GM";
      if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
      return (words[0][0] + words[1][0]).toUpperCase();
    }

    function bukaProdukHarga(item) {
      const gameName = item.game || item.provider || "";
      const categoryVal = item.category || gameName;
      const params = new URLSearchParams();
      params.set("game", gameName);
      params.set("provider", gameName);
      params.set("category", categoryVal);
      params.set("need_zone", item.need_zone ? "1" : "0");

      try {
        sessionStorage.setItem("selectedGameData", JSON.stringify({
          game: gameName,
          provider: gameName,
          category: categoryVal,
          need_zone: Boolean(item.need_zone),
          products: item.products ?? 0,
          img_url: item.img_url || ""
        }));
      } catch (_) {}

      window.location.href = `/produk-harga?${params.toString()}`;
    }

    function renderGames(list) {
      gamesGrid.innerHTML = "";

      if (!Array.isArray(list) || list.length === 0) {
        gameCountText.textContent = "0 game ditemukan";
        gamesGrid.innerHTML = `
          <div class="message-box">
            <strong>Game tidak ditemukan</strong>
            <p>Coba kata kunci pencarian lain atau reset pencarian.</p>
          </div>
        `;
        return;
      }

      gameCountText.textContent = `${list.length} game tersedia`;

      list.forEach((item) => {
        const gameName = item.game || item.provider || "Game Tanpa Nama";
        const totalItems = item.products ?? item.total_products ?? 0;
        const needZone = Boolean(item.need_zone);

        const card = document.createElement("div");
        card.className = "game-card";
        card.setAttribute("role", "button");
        card.setAttribute("tabindex", "0");

        const iconBox = document.createElement("div");
        iconBox.className = "icon-box";

        if (item.img_url) {
          const img = document.createElement("img");
          img.src = item.img_url;
          img.alt = gameName;
          img.loading = "lazy";
          img.onerror = () => {
            iconBox.innerHTML = `<span class="icon-fallback">${getInitials(gameName)}</span>`;
          };
          iconBox.appendChild(img);
        } else {
          iconBox.innerHTML = `<span class="icon-fallback">${getInitials(gameName)}</span>`;
        }

        const titleEl = document.createElement("div");
        titleEl.className = "game-name";
        titleEl.textContent = gameName;

        const chipsEl = document.createElement("div");
        chipsEl.className = "chips";
        chipsEl.innerHTML = `
          <span class="chip chip-item">${totalItems} Item</span>
          <span class="chip ${needZone ? "chip-zone" : "chip-nozone"}">
            ${needZone ? "Zone ID" : "ID Only"}
          </span>
        `;

        card.appendChild(iconBox);
        card.appendChild(titleEl);
        card.appendChild(chipsEl);

        card.addEventListener("click", () => bukaProdukHarga(item));
        card.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            bukaProdukHarga(item);
          }
        });

        gamesGrid.appendChild(card);
      });
    }

    async function fetchGames(searchQuery = "") {
      gamesGrid.innerHTML = `
        <div class="message-box">
          <strong>Memuat daftar game...</strong>
          <p>Mohon tunggu sebentar.</p>
        </div>
      `;

      const endpoints = [
        `/produk${searchQuery ? `?search=${encodeURIComponent(searchQuery)}` : ""}`,
        `/api/webtrx/produk${searchQuery ? `?search=${encodeURIComponent(searchQuery)}` : ""}`
      ];

      for (const url of endpoints) {
        try {
          const res = await fetch(url, { credentials: "include" });
          if (!res.ok) continue;
          const json = await res.json();
          const data = Array.isArray(json?.data) ? json.data : Array.isArray(json) ? json : [];
          if (!searchQuery) {
            allGames = data;
          }
          renderGames(data);
          return;
        } catch (_) {}
      }

      gameCountText.textContent = "Gagal memuat data";
      gamesGrid.innerHTML = `
        <div class="message-box">
          <strong>Gagal memuat daftar game</strong>
          <p>Periksa koneksi atau pastikan endpoint <code>/produk</code> aktif.</p>
        </div>
      `;
    }

    let searchTimer;
    searchInput.addEventListener("input", (e) => {
      const val = e.target.value.trim();
      clearSearchBtn.classList.toggle("show", val.length > 0);
      clearTimeout(searchTimer);

      searchTimer = setTimeout(() => {
        if (allGames.length > 0) {
          const filtered = val
            ? allGames.filter((g) =>
                String(g.game || g.provider || "").toLowerCase().includes(val.toLowerCase())
              )
            : allGames;
          renderGames(filtered);
        } else {
          fetchGames(val);
        }
      }, 150);
    });

    clearSearchBtn.addEventListener("click", () => {
      searchInput.value = "";
      clearSearchBtn.classList.remove("show");
      if (allGames.length > 0) {
        renderGames(allGames);
      } else {
        fetchGames("");
      }
      searchInput.focus();
    });

    fetchGames("");
  </script>
</body>
</html>
