<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar Harga &amp; Order - POW! TOPUP</title>
  <style>
    :root {
      --bg: #eef7f0;
      --card: #ffffff;
      --card-soft: #f5fbf7;
      --ink: #13211a;
      --muted: #4c6357;
      --primary: #18a957;
      --primary-dark: #117e40;
      --accent: #ff5d8f;
      --warn: #ffd447;
      --zone-bg: #d9eeff;
      --zone-ink: #0f4c81;
      --border: #13211a;
      --shadow: 4px 4px 0px #13211a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 16px 16px 40px;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
    }

    .top-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .nav-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 15px;
      border: 2.5px solid var(--border);
      border-radius: 14px;
      font-weight: 800;
      font-size: 0.9rem;
      text-decoration: none;
      color: var(--ink);
      background: var(--warn);
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .btn:hover {
      filter: brightness(0.98);
    }

    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px var(--border);
    }

    .btn-white {
      background: var(--card);
    }

    .btn-green {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-green:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .header-card {
      position: relative;
      background: var(--card);
      border: 3px solid var(--border);
      border-radius: 22px;
      padding: 20px;
      box-shadow: 6px 6px 0px var(--border);
      margin-bottom: 20px;
    }

    .badge-tag {
      position: absolute;
      top: -13px;
      right: 18px;
      background: var(--accent);
      color: #fff;
      font-weight: 800;
      font-size: 0.76rem;
      padding: 5px 12px;
      border: 2.5px solid var(--border);
      border-radius: 999px;
      box-shadow: 3px 3px 0px var(--border);
    }

    .game-heading {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .game-heading h1 {
      font-size: 1.45rem;
      font-weight: 900;
    }

    .pill {
      font-size: 0.78rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      border: 2px solid var(--border);
      background: var(--zone-bg);
      color: var(--zone-ink);
    }

    .pill-neutral {
      background: #e9f5ed;
      color: var(--ink);
    }

    .pill-flash {
      background: #ffe4e6;
      color: #9f1239;
    }

    .sub-text {
      color: var(--muted);
      font-size: 0.92rem;
      margin-bottom: 14px;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .search-box {
      flex: 1 1 260px;
    }

    .input-field {
      width: 100%;
      padding: 11px 14px;
      border: 2.5px solid var(--border);
      border-radius: 13px;
      font-size: 0.95rem;
      font-weight: 600;
      background: #f9fffb;
      color: var(--ink);
      outline: none;
    }

    .input-field:focus {
      background: #ffffff;
      box-shadow: 3px 3px 0px var(--border);
    }

    .layout-grid {
      display: grid;
      grid-template-columns: 1.55fr 1fr;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 820px) {
      .layout-grid {
        grid-template-columns: 1fr;
      }
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(225px, 1fr));
      gap: 12px;
    }

    .item-card {
      background: var(--card);
      border: 2.5px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      box-shadow: 4px 4px 0px var(--border);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.1s ease;
    }

    .item-card:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px var(--border);
      background: var(--card-soft);
    }

    .item-card.selected {
      background: #dcfce7;
      border-width: 3px;
      box-shadow: 5px 5px 0px var(--primary-dark);
    }

    .item-top {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .item-code {
      font-size: 0.74rem;
      font-weight: 800;
      color: var(--muted);
      background: #eef3f0;
      padding: 2px 8px;
      border-radius: 7px;
      border: 1.5px solid var(--border);
    }

    .item-badge {
      font-size: 0.7rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 7px;
      border: 1.5px solid var(--border);
      background: var(--zone-bg);
      color: var(--zone-ink);
    }

    .item-badge-flash {
      background: var(--warn);
      color: var(--ink);
    }

    .item-name {
      font-size: 0.98rem;
      font-weight: 800;
      line-height: 1.3;
    }

    .item-meta {
      font-size: 0.76rem;
      color: var(--muted);
      font-weight: 600;
    }

    .price-wrap {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .item-price-ori {
      font-size: 0.78rem;
      color: #888;
      text-decoration: line-through;
    }

    .item-price {
      font-size: 1.06rem;
      font-weight: 900;
      color: var(--primary-dark);
    }

    .order-panel {
      background: var(--card);
      border: 3px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 6px 6px 0px var(--border);
      position: sticky;
      top: 16px;
    }

    .order-panel h2 {
      font-size: 1.15rem;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.84rem;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .summary-box {
      background: var(--card-soft);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 14px;
      font-size: 0.9rem;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .summary-row:last-child {
      margin-bottom: 0;
      font-weight: 900;
      font-size: 1rem;
      padding-top: 6px;
      border-top: 1.5px dashed #b7c9be;
    }

    .alert {
      margin-top: 12px;
      padding: 12px;
      border-radius: 12px;
      border: 2px solid var(--border);
      font-size: 0.88rem;
      font-weight: 700;
      display: none;
      white-space: pre-line;
    }

    .alert.show {
      display: block;
    }

    .alert-success {
      background: #dcfce7;
      color: #0e4b25;
    }

    .alert-error {
      background: #ffe4e6;
      color: #881337;
    }

    .empty-state {
      grid-column: 1 / -1;
      background: var(--card);
      border: 2.5px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      box-shadow: var(--shadow);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-nav">
      <div class="nav-group">
        <a href="/produk" class="btn btn-white">&larr; Pilih Game</a>
        <a href="/dashboard" class="btn">Dashboard</a>
      </div>
      <span class="btn btn-green">PRICE LIST DITZNESIA</span>
    </div>

    <section class="header-card">
      <div class="badge-tag">INSTAN TOPUP</div>
      <div class="game-heading">
        <h1 id="gameTitle">Memuat Game...</h1>
        <span id="zonePill" class="pill pill-neutral">Cek Zone...</span>
        <span id="checkNamePill" class="pill pill-neutral">Cek Akun...</span>
        <span id="totalPill" class="pill pill-neutral">0 Nominal</span>
      </div>
      <p class="sub-text" id="gameSubtitle">Pilih nominal layanan di bawah ini lalu isi ID tujuan untuk memesan.</p>

      <div class="filter-row">
        <div class="search-box">
          <input
            type="text"
            id="searchNominalInput"
            class="input-field"
            placeholder="Cari nominal (contoh: 5 Diamond, Weekly Pass, kode)..."
            autocomplete="off"
          />
        </div>
        <button type="button" id="reloadBtn" class="btn btn-white">Refresh Harga</button>
      </div>
    </section>

    <div class="layout-grid">
      <section>
        <div id="productsGrid" class="products-grid">
          <div class="empty-state">
            <strong>Memuat daftar harga...</strong>
          </div>
        </div>
      </section>

      <aside class="order-panel">
        <h2>Detail Pesanan</h2>

        <div class="summary-box">
          <div class="summary-row">
            <span>Game</span>
            <strong id="summaryGame">-</strong>
          </div>
          <div class="summary-row">
            <span>Layanan</span>
            <strong id="summaryProduct">Belum dipilih</strong>
          </div>
          <div class="summary-row">
            <span>Kode</span>
            <span id="summaryCode">-</span>
          </div>
          <div class="summary-row">
            <span>Zone ID</span>
            <span id="summaryZone">-</span>
          </div>
          <div class="summary-row">
            <span>Harga</span>
            <span id="summaryPrice">Rp 0</span>
          </div>
        </div>

        <form id="orderForm">
          <div class="form-group">
            <label for="targetInput">User ID / Target Tujuan</label>
            <input
              type="text"
              id="targetInput"
              class="input-field"
              placeholder="Masukkan User ID / Player ID"
              required
            />
          </div>

          <div class="form-group" id="zoneGroup">
            <label for="zoneInput" id="zoneLabel">Zone ID / Server ID</label>
            <input
              type="text"
              id="zoneInput"
              class="input-field"
              placeholder="Masukkan Zone ID / Server ID"
            />
          </div>

          <button type="submit" id="submitOrderBtn" class="btn btn-green" style="width: 100%;" disabled>
            Pilih Nominal Terlebih Dahulu
          </button>
        </form>

        <div id="orderAlert" class="alert"></div>
      </aside>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);

    let cachedSession = {};
    try {
      cachedSession = JSON.parse(sessionStorage.getItem("selectedGameData") || "{}");
    } catch (_) {}

    const selectedGame =
      urlParams.get("game") ||
      urlParams.get("provider") ||
      cachedSession.game ||
      cachedSession.provider ||
      "";

    const paramNeedZone = urlParams.get("need_zone");
    let needZone =
      paramNeedZone !== null
        ? paramNeedZone === "1" || paramNeedZone === "true"
        : Boolean(cachedSession.need_zone);

    const gameTitleEl = document.getElementById("gameTitle");
    const gameSubtitleEl = document.getElementById("gameSubtitle");
    const zonePillEl = document.getElementById("zonePill");
    const checkNamePillEl = document.getElementById("checkNamePill");
    const totalPillEl = document.getElementById("totalPill");
    const productsGridEl = document.getElementById("productsGrid");
    const searchNominalInput = document.getElementById("searchNominalInput");
    const reloadBtn = document.getElementById("reloadBtn");

    const summaryGameEl = document.getElementById("summaryGame");
    const summaryProductEl = document.getElementById("summaryProduct");
    const summaryCodeEl = document.getElementById("summaryCode");
    const summaryZoneEl = document.getElementById("summaryZone");
    const summaryPriceEl = document.getElementById("summaryPrice");

    const orderForm = document.getElementById("orderForm");
    const targetInput = document.getElementById("targetInput");
    const zoneGroup = document.getElementById("zoneGroup");
    const zoneInput = document.getElementById("zoneInput");
    const submitOrderBtn = document.getElementById("submitOrderBtn");
    const orderAlert = document.getElementById("orderAlert");

    let allProducts = [];
    let selectedProduct = null;

    function formatRupiah(num) {
      const val = parseInt(num, 10) || 0;
      return "Rp " + val.toLocaleString("id-ID");
    }

    function updateZoneRequirement(required) {
      needZone = Boolean(required);
      zonePillEl.textContent = needZone ? "need_zone: true" : "need_zone: false";
      zoneInput.required = needZone;
      zoneGroup.style.display = needZone ? "block" : "none";
      summaryZoneEl.textContent = needZone ? "Wajib diisi" : "Tidak diperlukan";
    }

    function updateCheckNameBadge(canCheck) {
      checkNamePillEl.textContent = canCheck ? "Cek Nickname: Aktif" : "Cek Nickname: Tidak";
    }

    function showAlert(type, message) {
      orderAlert.className = `alert show alert-${type === "success" ? "success" : "error"}`;
      orderAlert.textContent = message;
    }

    function selectProduct(item, cardElement) {
      selectedProduct = item;

      document.querySelectorAll(".item-card").forEach((el) => {
        el.classList.remove("selected");
      });
      if (cardElement) {
        cardElement.classList.add("selected");
      }

      if (typeof item.need_zone === "boolean") {
        updateZoneRequirement(item.need_zone);
      }
      if (typeof item.check_name === "boolean") {
        updateCheckNameBadge(item.check_name);
      }

      summaryProductEl.textContent = item.name || item.code;
      summaryCodeEl.textContent = item.code || "-";
      summaryPriceEl.textContent = formatRupiah(item.price);

      submitOrderBtn.disabled = false;
      submitOrderBtn.textContent = `Order Sekarang (${formatRupiah(item.price)})`;
      orderAlert.className = "alert";
    }

    // Normalisasi respons baik dari /layanan/price-list maupun langsung array Ditznesia /tp-products
    function normalizeProducts(rawPayload) {
      const arr = Array.isArray(rawPayload?.data)
        ? rawPayload.data
        : Array.isArray(rawPayload)
        ? rawPayload
        : [];

      const filtered = selectedGame
        ? arr.filter(
            (item) =>
              String(item.game || item.provider || item.category || "").toLowerCase() ===
              String(selectedGame).toLowerCase()
          )
        : arr;

      return filtered.length > 0 ? filtered : arr;
    }

    function renderProducts(list) {
      productsGridEl.innerHTML = "";
      totalPillEl.textContent = `${list.length} Nominal`;

      if (!Array.isArray(list) || list.length === 0) {
        productsGridEl.innerHTML = `
          <div class="empty-state">
            <strong>Nominal tidak ditemukan</strong>
            <p style="margin-top:6px;color:#4c6357;">Tidak ada layanan yang cocok untuk game atau kata kunci ini.</p>
          </div>
        `;
        return;
      }

      list.forEach((item) => {
        const card = document.createElement("div");
        card.className = "item-card";
        if (selectedProduct && String(selectedProduct.code) === String(item.code)) {
          card.classList.add("selected");
        }

        const isUnavailable =
          item.status &&
          ["empty", "gangguan", "nonaktif", "inactive", "offline"].includes(
            String(item.status).toLowerCase()
          );

        const oriPriceNum = parseInt(item.price_original, 10);
        const hasOriPrice = Number.isFinite(oriPriceNum) && oriPriceNum > (parseInt(item.price, 10) || 0);

        card.innerHTML = `
          <div class="item-top">
            <span class="item-code">code: ${item.code}</span>
            ${item.need_zone ? `<span class="item-badge">need_zone: true</span>` : ""}
            ${item.check_name ? `<span class="item-badge">check_name: true</span>` : ""}
            ${item.flash ? `<span class="item-badge item-badge-flash">Flash</span>` : ""}
          </div>
          <div class="item-name">${item.name || "-"}</div>
          <div class="item-meta">game: ${item.game || selectedGame || "-"}</div>
          ${item.note ? `<div class="item-meta">${item.note}</div>` : ""}
          <div class="price-wrap">
            ${hasOriPrice ? `<span class="item-price-ori">${formatRupiah(oriPriceNum)}</span>` : ""}
            <span class="item-price">${isUnavailable ? "Gangguan" : formatRupiah(item.price)}</span>
          </div>
        `;

        if (!isUnavailable) {
          card.addEventListener("click", () => selectProduct(item, card));
        } else {
          card.style.opacity = "0.6";
          card.style.cursor = "not-allowed";
        }

        productsGridEl.appendChild(card);
      });
    }

    async function loadPriceList() {
      if (!selectedGame) {
        gameTitleEl.textContent = "Game Tidak Dipilih";
        gameSubtitleEl.textContent = "Silakan kembali ke halaman pilih game terlebih dahulu.";
        productsGridEl.innerHTML = `
          <div class="empty-state">
            <strong>Parameter game kosong</strong>
            <p style="margin-top:8px;"><a href="/produk" class="btn">Kembali ke Daftar Game</a></p>
          </div>
        `;
        return;
      }

      gameTitleEl.textContent = selectedGame;
      summaryGameEl.textContent = selectedGame;
      updateZoneRequirement(needZone);
      updateCheckNameBadge(false);

      productsGridEl.innerHTML = `
        <div class="empty-state">
          <strong>Memuat price list ${selectedGame}...</strong>
        </div>
      `;

      // Utamakan endpoint POST /layanan/price-list yang terhubung ke Ditznesia
      const postEndpoints = ["/layanan/price-list", "/api/webtrx/layanan/price-list"];
      for (const endpoint of postEndpoints) {
        try {
          const res = await fetch(endpoint, {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              game: selectedGame,
              provider: selectedGame
            })
          });
          if (!res.ok) continue;
          const json = await res.json();
          const list = normalizeProducts(json);
          if (list.length > 0 || json?.success) {
            allProducts = list;
            if (allProducts.length > 0) {
              if (typeof allProducts[0].need_zone === "boolean" && paramNeedZone === null) {
                updateZoneRequirement(allProducts[0].need_zone);
              }
              updateCheckNameBadge(Boolean(allProducts[0].check_name));
            }
            renderProducts(allProducts);
            return;
          }
        } catch (_) {}
      }

      // Fallback ke GET /produk-provider
      const getEndpoints = [
        `/produk-provider?game=${encodeURIComponent(selectedGame)}&provider=${encodeURIComponent(selectedGame)}`,
        `/api/webtrx/produk-provider?game=${encodeURIComponent(selectedGame)}&provider=${encodeURIComponent(selectedGame)}`
      ];

      for (const endpoint of getEndpoints) {
        try {
          const res = await fetch(endpoint, { credentials: "include" });
          if (!res.ok) continue;
          const json = await res.json();
          const list = normalizeProducts(json);
          allProducts = list;
          if (allProducts.length > 0) {
            if (typeof allProducts[0].need_zone === "boolean" && paramNeedZone === null) {
              updateZoneRequirement(allProducts[0].need_zone);
            }
            updateCheckNameBadge(Boolean(allProducts[0].check_name));
          }
          renderProducts(allProducts);
          return;
        } catch (_) {}
      }

      totalPillEl.textContent = "Error";
      productsGridEl.innerHTML = `
        <div class="empty-state">
          <strong>Gagal memuat price list</strong>
          <p style="margin-top:6px;color:#4c6357;">Pastikan endpoint <code>/layanan/price-list</code> atau <code>/produk-provider</code> aktif di server.</p>
        </div>
      `;
    }

    searchNominalInput.addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      if (!q) {
        renderProducts(allProducts);
        return;
      }
      const filtered = allProducts.filter(
        (item) =>
          String(item.name || "").toLowerCase().includes(q) ||
          String(item.code || "").toLowerCase().includes(q) ||
          String(item.game || "").toLowerCase().includes(q)
      );
      renderProducts(filtered);
    });

    reloadBtn.addEventListener("click", () => {
      searchNominalInput.value = "";
      loadPriceList();
    });

    orderForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!selectedProduct) {
        showAlert("error", "Silakan pilih nominal layanan terlebih dahulu.");
        return;
      }

      const tujuan = targetInput.value.trim();
      const zone = zoneInput.value.trim();

      if (!tujuan) {
        showAlert("error", "User ID / Target tujuan wajib diisi.");
        return;
      }

      if (needZone && !zone) {
        showAlert("error", "Game ini membutuhkan Zone ID / Server ID.");
        return;
      }

      submitOrderBtn.disabled = true;
      submitOrderBtn.textContent = "Memproses Order...";

      const orderEndpoints = ["/order/create", "/api/webtrx/order/create"];
      let orderDone = false;

      for (const endpoint of orderEndpoints) {
        try {
          const res = await fetch(endpoint, {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              code: selectedProduct.code,
              tujuan,
              target: tujuan,
              ...(zone ? { zone } : {})
            })
          });

          if (res.status === 404) continue;

          const result = await res.json();
          orderDone = true;

          if (res.ok && result.success) {
            const trx = result.data || {};
            showAlert(
              "success",
              `Order berhasil dibuat!
ID: ${trx.id || "-"}
Status: ${trx.status || "pending"}
Harga: ${formatRupiah(trx.price || selectedProduct.price)}`
            );
          } else {
            showAlert("error", result.message || "Gagal membuat order.");
          }
          break;
        } catch (err) {
          showAlert("error", err.message || "Terjadi kesalahan jaringan.");
          orderDone = true;
          break;
        }
      }

      if (!orderDone) {
        showAlert("error", "Endpoint /order/create tidak ditemukan (404).");
      }

      submitOrderBtn.disabled = false;
      submitOrderBtn.textContent = `Order Sekarang (${formatRupiah(selectedProduct.price)})`;
    });

    loadPriceList();
  </script>
</body>
</html>
