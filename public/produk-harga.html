<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Harga & Order - Comic Edition</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Chakra+Petch:wght@600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --comic-ink: #111827;
            --comic-green: #22c55e;
            --comic-green-dark: #15803d;
            --comic-yellow: #fde047;
            --comic-bg: #f0fdf4;
            --comic-card: #ffffff;
            --comic-text: #111827;
            --comic-muted: #374151;
            --comic-dot: rgba(21, 128, 61, 0.14);
            --comic-shadow: 5px 5px 0px #111827;
            --comic-shadow-lg: 7px 7px 0px #111827;
        }

        [data-theme="dark"] {
            --comic-bg: #0f1c14;
            --comic-card: #18291e;
            --comic-text: #f3f4f6;
            --comic-muted: #cbd5e1;
            --comic-dot: rgba(74, 222, 128, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Manrope', sans-serif;
            color: var(--comic-text);
            background-color: var(--comic-bg);
            background-image: radial-gradient(var(--comic-dot) 1.5px, transparent 1.5px);
            background-size: 16px 16px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .comic-display {
            font-family: 'Bangers', cursive;
            letter-spacing: 1.1px;
        }

        .comic-heading {
            font-family: 'Chakra Petch', sans-serif;
            font-weight: 700;
        }

        .comic-topbar {
            background: var(--comic-card);
            border-bottom: 3px solid var(--comic-ink);
            padding: 0.75rem 0;
            position: sticky;
            top: 0;
            z-index: 1030;
            box-shadow: 0 4px 0 var(--comic-ink);
        }

        .comic-btn-nav {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.42rem 0.85rem;
            border: 2.5px solid var(--comic-ink);
            border-radius: 10px;
            background: var(--comic-yellow);
            color: #111827;
            font-family: 'Chakra Petch', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            text-decoration: none;
            box-shadow: 3px 3px 0 var(--comic-ink);
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }

        .comic-btn-nav:hover {
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0 var(--comic-ink);
            color: #111827;
            background: #facc15;
        }

        .comic-panel {
            background: var(--comic-card);
            border: 3px solid var(--comic-ink);
            border-radius: 16px;
            padding: 1.2rem;
            box-shadow: var(--comic-shadow);
            position: relative;
        }

        .comic-step-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            background: var(--comic-yellow);
            color: #111827;
            border: 2px solid var(--comic-ink);
            border-radius: 8px;
            padding: 0.15rem 0.6rem;
            font-family: 'Chakra Petch', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            box-shadow: 2px 2px 0 var(--comic-ink);
        }

        .comic-input {
            background: var(--comic-card) !important;
            color: var(--comic-text) !important;
            border: 2.5px solid var(--comic-ink) !important;
            border-radius: 10px !important;
            box-shadow: 3px 3px 0 var(--comic-ink);
            font-weight: 700;
        }

        .comic-input:focus {
            outline: none;
            background: #fefce8 !important;
            box-shadow: 4px 4px 0 var(--comic-ink);
        }

        [data-theme="dark"] .comic-input:focus {
            background: #1e3326 !important;
        }

        .comic-price-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(225px, 1fr));
            gap: 1rem;
        }

        .comic-price-card {
            background: var(--comic-card);
            border: 3px solid var(--comic-ink);
            border-radius: 14px;
            padding: 1rem;
            cursor: pointer;
            box-shadow: var(--comic-shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.14s ease, box-shadow 0.14s ease, background-color 0.14s ease;
        }

        .comic-price-card:hover {
            transform: translate(-2px, -2px);
            box-shadow: var(--comic-shadow-lg);
        }

        .comic-price-card:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 var(--comic-ink);
        }

        .comic-price-card.selected {
            background: #dcfce7;
            box-shadow: 6px 6px 0 var(--comic-green-dark);
        }

        [data-theme="dark"] .comic-price-card.selected {
            background: #1b3d27;
            box-shadow: 6px 6px 0 #4ade80;
        }

        .comic-prod-name {
            font-family: 'Chakra Petch', sans-serif;
            font-weight: 700;
            font-size: 0.96rem;
            line-height: 1.3;
            margin-bottom: 0.35rem;
        }

        .comic-prod-code {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--comic-muted);
            background: rgba(17, 24, 39, 0.06);
            border: 1.5px solid var(--comic-ink);
            border-radius: 6px;
            padding: 0.08rem 0.45rem;
            margin-bottom: 0.75rem;
        }

        [data-theme="dark"] .comic-prod-code {
            background: rgba(255, 255, 255, 0.08);
        }

        .comic-price-tag {
            font-family: 'Chakra Petch', sans-serif;
            font-weight: 700;
            font-size: 1.12rem;
            color: #15803d;
        }

        [data-theme="dark"] .comic-price-tag {
            color: #4ade80;
        }

        .comic-strike {
            font-size: 0.78rem;
            text-decoration: line-through;
            color: var(--comic-muted);
            margin-left: 0.35rem;
            font-weight: 600;
        }

        .comic-btn-order {
            background: linear-gradient(135deg, #4ade80 0%, #16a34a 100%);
            border: 2.5px solid var(--comic-ink);
            color: #ffffff;
            font-family: 'Chakra Petch', sans-serif;
            font-weight: 700;
            padding: 0.65rem 1.35rem;
            border-radius: 12px;
            box-shadow: 4px 4px 0 var(--comic-ink);
            text-shadow: 1px 1px 0 var(--comic-ink);
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }

        .comic-btn-order:hover {
            transform: translate(-1px, -1px);
            box-shadow: 5px 5px 0 var(--comic-ink);
            color: #ffffff;
        }

        .comic-btn-order:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 var(--comic-ink);
        }

        @media (max-width: 575.98px) {
            .comic-price-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.75rem;
            }
            .comic-price-card {
                padding: 0.85rem;
            }
            .comic-price-tag {
                font-size: 0.98rem;
            }
        }
    </style>
</head>
<body data-theme="light">
    <header class="comic-topbar">
        <div class="container d-flex align-items-center justify-content-between gap-2">
            <a href="/produk-detail?category=Games" class="comic-btn-nav">
                <i class="bi bi-arrow-left"></i>
                <span>Game</span>
            </a>
            <h5 id="gameTitle" class="mb-0 comic-display fs-4 text-truncate">MEMUAT HARGA...</h5>
            <a href="/dashboard" class="comic-btn-nav">
                <i class="bi bi-house-door-fill"></i>
                <span class="d-none d-sm-inline">Home</span>
            </a>
        </div>
    </header>

    <main class="container py-4">
        <!-- Step 1: Data Tujuan -->
        <div class="comic-panel mb-4">
            <div class="mb-3">
                <span class="comic-step-badge"><i class="bi bi-person-badge-fill"></i> STEP 1 • AKUN TUJUAN</span>
            </div>
            <div class="row g-3">
                <div class="col-md-6" id="targetCol">
                    <label for="inputTarget" class="form-label small fw-bold">User ID / ID Pemain <span class="text-danger">*</span></label>
                    <input type="text" id="inputTarget" class="form-control comic-input" placeholder="Contoh: 123456789">
                </div>
                <div class="col-md-6" id="zoneCol" style="display: none;">
                    <label for="inputZone" class="form-label small fw-bold">Zone ID / Server <span class="text-danger">*</span></label>
                    <input type="text" id="inputZone" class="form-control comic-input" placeholder="Contoh: 1234">
                </div>
            </div>
        </div>

        <!-- Step 2: Pilih Nominal & Harga -->
        <div class="comic-panel mb-4">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                <span class="comic-step-badge"><i class="bi bi-tags-fill"></i> STEP 2 • PILIH NOMINAL & HARGA</span>
                <input type="text" id="searchNominal" class="form-control form-control-sm comic-input" style="max-width: 250px;" placeholder="Cari nominal atau kode...">
            </div>

            <div id="harga-container" class="comic-price-grid">
                <div class="text-center py-5" style="grid-column: 1 / -1;">
                    <div class="spinner-border text-success" role="status"></div>
                    <p class="mt-2 mb-0 fw-bold">Memuat daftar harga...</p>
                </div>
            </div>
        </div>

        <!-- Step 3: Checkout -->
        <div class="comic-panel" id="orderSummaryCard" style="display: none; background: #fef9c3; color: #111827;">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
                <div>
                    <div class="small fw-bold text-uppercase">Item Terpilih</div>
                    <div class="comic-heading fs-6" id="selectedProductName">-</div>
                    <div class="comic-heading fs-5 text-success" id="selectedProductPrice">Rp 0</div>
                </div>
                <button type="button" id="btnSubmitOrder" class="btn comic-btn-order">
                    <i class="bi bi-cart-check-fill me-1"></i> BELI SEKARANG
                </button>
            </div>
        </div>
    </main>

    <!-- Modal Hasil Order -->
    <div class="modal fade" id="orderResultModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="background: var(--comic-card); color: var(--comic-text); border: 3px solid var(--comic-ink); box-shadow: var(--comic-shadow);">
                <div class="modal-header" style="border-bottom: 2.5px solid var(--comic-ink);">
                    <h5 class="modal-title comic-heading" id="resultModalTitle">Status Transaksi</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="resultModalBody"></div>
                <div class="modal-footer" style="border-top: 2.5px solid var(--comic-ink);">
                    <button type="button" class="btn comic-btn-nav" data-bs-dismiss="modal">Tutup</button>
                    <a href="/dashboard" class="btn comic-btn-order">Dashboard</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script>
        const savedTheme = localStorage.getItem('vp-theme') || 'light';
        document.body.setAttribute('data-theme', savedTheme);

        const params = new URLSearchParams(window.location.search);
        const game = params.get("game") || params.get("provider") || "";
        const needZoneParam = params.get("need_zone") === "1" || params.get("need_zone") === "true";

        const gameTitle = document.getElementById("gameTitle");
        const zoneCol = document.getElementById("zoneCol");
        const inputTarget = document.getElementById("inputTarget");
        const inputZone = document.getElementById("inputZone");
        const searchNominal = document.getElementById("searchNominal");
        const hargaContainer = document.getElementById("harga-container");
        const orderSummaryCard = document.getElementById("orderSummaryCard");
        const selectedProductName = document.getElementById("selectedProductName");
        const selectedProductPrice = document.getElementById("selectedProductPrice");
        const btnSubmitOrder = document.getElementById("btnSubmitOrder");

        let allProducts = [];
        let priceListMap = new Map();
        let autoMarkupPercent = 0;
        let selectedProduct = null;
        let requiresZone = needZoneParam;

        async function loadPriceListReference() {
            try {
                const res = await fetch('/api/webtrx/layanan/price-list', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });
                if (!res.ok) return new Map();
                const json = await res.json();
                const list = Array.isArray(json.data) ? json.data : (Array.isArray(json.price_list) ? json.price_list : []);
                const map = new Map();
                list.forEach(item => {
                    const keyCode = String(item.code || item.sku || item.id || '').trim().toLowerCase();
                    const keyName = String(item.name || item.layanan || item.product_name || '').trim().toLowerCase();
                    const refPrice = parseNumber(item.price ?? item.harga ?? item.selling_price ?? item.amount);
                    if (keyCode && refPrice > 0) {
                        map.set('code:' + keyCode, refPrice);
                    }
                    if (keyName && refPrice > 0 && !map.has('name:' + keyName)) {
                        map.set('name:' + keyName, refPrice);
                    }
                });
                return map;
            } catch (e) {
                return new Map();
            }
        }

        function getReferencePrice(item) {
            const code = String(item.code || item.sku || item.id || '').trim().toLowerCase();
            const name = String(item.name || item.layanan || item.product_name || '').trim().toLowerCase();

            if (code && priceListMap.has('code:' + code)) {
                return priceListMap.get('code:' + code);
            }
            if (name && priceListMap.has('name:' + name)) {
                return priceListMap.get('name:' + name);
            }

            const embeddedCandidates = [
                item.price_list,
                item.pricelist_price,
                item.harga_modal,
                item.base_price,
                item.cost_price,
                item.modal
            ];
            for (const c of embeddedCandidates) {
                const n = parseNumber(c);
                if (n > 0) return n;
            }
            return 0;
        }

        function computeAddOnPercent(item, currentPrice) {
            const refPrice = getReferencePrice(item);
            if (!refPrice || refPrice <= 0 || !currentPrice || currentPrice <= 0) {
                return 0;
            }
            // Selalu dihitung sebagai tambahan persen (bukan pengurangan harga)
            const diff = Math.abs(currentPrice - refPrice);
            return (diff / refPrice) * 100;
        }

        function detectAutoMarkupPercent(products) {
            const percents = [];
            products.forEach(item => {
                const p = getProductPrice(item);
                const pct = computeAddOnPercent(item, p);
                if (pct > 0 && Number.isFinite(pct)) {
                    percents.push(pct);
                }
            });
            if (!percents.length) return 0;
            const avg = percents.reduce((acc, v) => acc + v, 0) / percents.length;
            return Number(avg.toFixed(2));
        }

        function getFinalDisplayPrice(item) {
            const basePrice = getProductPrice(item);
            if (basePrice <= 0) return 0;
            const refPrice = getReferencePrice(item);
            // Jika ada harga referensi di price-list dan harga item lebih rendah, tambahkan selisih persennya (tambah harga)
            if (refPrice > 0 && basePrice < refPrice) {
                const addPct = Math.abs(autoMarkupPercent);
                const addedPrice = Math.round(basePrice * (1 + addPct / 100));
                return addedPrice;
            }
            return Math.round(basePrice);
        }

        gameTitle.innerText = game ? game.toUpperCase() : "DAFTAR HARGA";
        if (requiresZone) {
            zoneCol.style.display = "block";
        }

        function parseNumber(val) {
            if (typeof val === "number") return Number.isFinite(val) ? val : 0;
            if (!val) return 0;
            const cleaned = String(val).replace(/[^0-9.-]/g, "");
            const num = Number(cleaned);
            return Number.isFinite(num) ? num : 0;
        }

        function getProductPrice(item) {
            const flashVal = parseNumber(item.flash);
            if (flashVal > 0) return flashVal;
            const candidates = [
                item.price,
                item.harga,
                item.selling_price,
                item.price_user,
                item.price_member,
                item.amount
            ];
            for (const c of candidates) {
                const n = parseNumber(c);
                if (n > 0) return n;
            }
            return 0;
        }

        function formatRupiah(angka) {
            return "Rp " + parseNumber(angka).toLocaleString("id-ID");
        }

        function renderProducts(products) {
            hargaContainer.innerHTML = "";

            if (!products || products.length === 0) {
                hargaContainer.innerHTML = `
                    <div class="text-center py-5" style="grid-column: 1 / -1;">
                        <i class="bi bi-inbox fs-1" style="color: var(--comic-muted);"></i>
                        <p class="mt-2 mb-0 fw-bold" style="color: var(--comic-muted);">Tidak ada daftar harga untuk game ini.</p>
                    </div>
                `;
                return;
            }

            if (products.some(p => Boolean(p.need_zone))) {
                requiresZone = true;
                zoneCol.style.display = "block";
            }

            products.forEach(item => {
                const code = item.code || item.sku || item.id || "-";
                const name = item.name || item.layanan || item.product_name || "-";
                const isSelected = selectedProduct && String(selectedProduct._code) === String(code);
                const displayPrice = getFinalDisplayPrice(item);
                const oriPrice = parseNumber(item.price_original || item.original_price);

                const card = document.createElement("div");
                card.className = `comic-price-card ${isSelected ? "selected" : ""}`;

                const originalPriceHtml = (oriPrice > displayPrice)
                    ? `<span class="comic-strike">${formatRupiah(oriPrice)}</span>`
                    : "";

                card.innerHTML = `
                    <div>
                        <div class="comic-prod-name">${name}</div>
                        <span class="comic-prod-code">KODE: ${code}</span>
                    </div>
                    <div class="d-flex align-items-center justify-content-between mt-2 pt-2" style="border-top: 2px dashed rgba(17,24,39,0.2);">
                        <div>
                            <div class="comic-price-tag">${formatRupiah(displayPrice)}</div>
                            ${originalPriceHtml}
                        </div>
                        <i class="bi ${isSelected ? "bi-check-circle-fill text-success" : "bi-plus-circle-fill"} fs-4"></i>
                    </div>
                `;

                card.addEventListener("click", () => {
                    selectedProduct = { ...item, _code: code, _name: name, _price: displayPrice };
                    if (item.need_zone) {
                        requiresZone = true;
                        zoneCol.style.display = "block";
                    }
                    selectedProductName.innerText = `${name} (${code})`;
                    selectedProductPrice.innerText = formatRupiah(displayPrice);
                    orderSummaryCard.style.display = "block";
                    renderProducts(products);
                    orderSummaryCard.scrollIntoView({ behavior: "smooth", block: "nearest" });
                });

                hargaContainer.appendChild(card);
            });
        }

        async function loadHarga() {
            let url = "/api/webtrx/produk-provider";
            if (game) {
                url += `?game=${encodeURIComponent(game)}`;
            }

            try {
                const [res, refMap] = await Promise.all([
                    fetch(url),
                    loadPriceListReference()
                ]);
                priceListMap = refMap;

                const json = await res.json();
                const rawList = Array.isArray(json.data)
                    ? json.data
                    : (Array.isArray(json.products) ? json.products : []);

                if (!rawList.length) {
                    allProducts = [];
                    autoMarkupPercent = 0;
                    renderProducts([]);
                    return;
                }

                autoMarkupPercent = detectAutoMarkupPercent(rawList);
                allProducts = rawList.sort((a, b) => getFinalDisplayPrice(a) - getFinalDisplayPrice(b));
                renderProducts(allProducts);
            } catch (err) {
                console.error(err);
                hargaContainer.innerHTML = `
                    <div class="text-center py-5 text-danger" style="grid-column: 1 / -1;">
                        <p class="mb-0 fw-bold">Gagal memuat daftar harga. Silakan muat ulang halaman.</p>
                    </div>
                `;
            }
        }

        searchNominal.addEventListener("input", (e) => {
            const keyword = e.target.value.trim().toLowerCase();
            if (!keyword) {
                renderProducts(allProducts);
                return;
            }
            const filtered = allProducts.filter(item =>
                String(item.name || item.layanan || item.product_name || "").toLowerCase().includes(keyword) ||
                String(item.code || item.sku || item.id || "").toLowerCase().includes(keyword)
            );
            renderProducts(filtered);
        });

        btnSubmitOrder.addEventListener("click", async () => {
            if (!selectedProduct) {
                alert("Silakan pilih nominal layanan terlebih dahulu.");
                return;
            }

            const targetVal = inputTarget.value.trim();
            const zoneVal = inputZone.value.trim();

            if (!targetVal) {
                alert("Harap isi User ID / ID Pemain.");
                inputTarget.focus();
                return;
            }

            if (requiresZone && !zoneVal) {
                alert("Game ini membutuhkan Zone ID / Server. Harap isi Zone ID.");
                inputZone.focus();
                return;
            }

            btnSubmitOrder.disabled = true;
            btnSubmitOrder.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> MEMPROSES...`;

            try {
                const payload = {
                    code: selectedProduct._code,
                    tujuan: targetVal,
                };
                if (requiresZone && zoneVal) {
                    payload.zone = zoneVal;
                }

                const res = await fetch("/api/webtrx/order/create", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                });

                const result = await res.json();
                const modalTitle = document.getElementById("resultModalTitle");
                const modalBody = document.getElementById("resultModalBody");

                if (result.success && result.data) {
                    modalTitle.innerText = "Order Berhasil Dibuat";
                    modalBody.innerHTML = `
                        <div class="alert alert-success mb-3">Transaksi berhasil dikirim dan sedang diproses.</div>
                        <p class="mb-1"><strong>ID Transaksi:</strong> ${result.data.id || "-"}</p>
                        <p class="mb-1"><strong>Layanan:</strong> ${selectedProduct._name}</p>
                        <p class="mb-1"><strong>Tujuan:</strong> ${targetVal}${zoneVal ? ` (${zoneVal})` : ""}</p>
                        <p class="mb-1"><strong>Harga:</strong> ${formatRupiah(result.data.price || selectedProduct._price)}</p>
                        <p class="mb-0"><strong>Status:</strong> <span class="badge bg-warning text-dark">${result.data.status || "pending"}</span></p>
                    `;
                } else {
                    modalTitle.innerText = "Order Gagal";
                    modalBody.innerHTML = `
                        <div class="alert alert-danger mb-0">${result.message || "Gagal membuat pesanan."}</div>
                    `;
                }

                const modal = new bootstrap.Modal(document.getElementById("orderResultModal"));
                modal.show();
            } catch (error) {
                alert("Terjadi kesalahan jaringan saat memproses order.");
            } finally {
                btnSubmitOrder.disabled = false;
                btnSubmitOrder.innerHTML = `<i class="bi bi-cart-check-fill me-1"></i> BELI SEKARANG`;
            }
        });
