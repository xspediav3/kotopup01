<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detail Harga Produk - POW! TOPUP</title>
  <style>
    :root {
      --bg: #eef7f0;
      --card: #ffffff;
      --card-alt: #e3f5e8;
      --card-soft: #f5fbf7;
      --ink: #13211a;
      --muted: #496054;
      --primary: #18a957;
      --primary-dark: #107d3f;
      --accent: #ff5d8f;
      --warn: #ffd447;
      --zone-bg: #d9eeff;
      --zone-ink: #0f4c81;
      --border: #13211a;
      --shadow: 4px 4px 0px #13211a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 16px 16px 40px;
    }

    .container {
      max-width: 1060px;
      margin: 0 auto;
    }

    .top-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .nav-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 15px;
      border: 2.5px solid var(--border);
      border-radius: 14px;
      font-weight: 800;
      font-size: 0.9rem;
      text-decoration: none;
      color: var(--ink);
      background: var(--warn);
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .btn:hover:not(:disabled) {
      transform: translate(-1px, -1px);
      box-shadow: 5px 5px 0px var(--border);
    }

    .btn:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px var(--border);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-white {
      background: var(--card);
    }

    .btn-green {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-danger {
      background: #ff5d8f;
      color: #ffffff;
    }

    .btn-sm {
      padding: 6px 10px;
      font-size: 0.78rem;
      border-radius: 10px;
      box-shadow: 2px 2px 0px var(--border);
    }

    .hero-box {
      position: relative;
      background: var(--card);
      border: 3px solid var(--border);
      border-radius: 22px;
      padding: 20px;
      box-shadow: 6px 6px 0px var(--border);
      margin-bottom: 18px;
    }

    .badge-tag {
      position: absolute;
      top: -13px;
      right: 18px;
      background: var(--accent);
      color: #fff;
      font-weight: 800;
      font-size: 0.76rem;
      letter-spacing: 0.5px;
      padding: 5px 12px;
      border: 2.5px solid var(--border);
      border-radius: 999px;
      box-shadow: 3px 3px 0px var(--border);
      transform: rotate(2deg);
    }

    .hero-title {
      font-size: 1.35rem;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .hero-sub {
      color: var(--muted);
      font-size: 0.92rem;
      margin-bottom: 14px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .search-wrap {
      position: relative;
      flex: 1 1 240px;
      display: flex;
      align-items: center;
    }

    .input-field {
      width: 100%;
      padding: 11px 14px;
      border: 2.5px solid var(--border);
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      background: #f9fffb;
      color: var(--ink);
      outline: none;
    }

    .input-field:focus {
      background: #ffffff;
      box-shadow: 3px 3px 0px var(--border);
    }

    .layout-grid {
      display: grid;
      grid-template-columns: 1.55fr 1fr;
      gap: 18px;
      align-items: start;
    }

    @media (max-width: 820px) {
      .layout-grid {
        grid-template-columns: 1fr;
      }
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .item-card {
      background: var(--card);
      border: 2.5px solid var(--border);
      border-radius: 18px;
      padding: 14px;
      box-shadow: 5px 5px 0px var(--border);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.1s ease;
    }

    .item-card:nth-child(even) {
      background: var(--card-soft);
    }

    .item-card:hover {
      transform: translate(-2px, -2px);
      box-shadow: 7px 7px 0px var(--border);
    }

    .item-card.selected {
      background: #c8f5d6;
      border-width: 3px;
      box-shadow: 6px 6px 0px var(--border);
    }

    .item-top {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      justify-content: space-between;
    }

    .chip {
      font-size: 0.74rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 8px;
      border: 2px solid var(--border);
    }

    .chip-code {
      background: var(--warn);
      color: var(--ink);
    }

    .item-name {
      font-size: 1rem;
      font-weight: 900;
      line-height: 1.3;
    }

    .price-row {
      margin-top: auto;
      padding-top: 6px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .item-price {
      font-size: 1.08rem;
      font-weight: 900;
      color: var(--primary-dark);
    }

    .order-panel {
      background: var(--card);
      border: 3px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 6px 6px 0px var(--border);
      position: sticky;
      top: 16px;
    }

    .order-panel h2 {
      font-size: 1.15rem;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.84rem;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .summary-box {
      background: var(--card-alt);
      border: 2.5px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 14px;
      font-size: 0.88rem;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .summary-row:last-child {
      margin-bottom: 0;
      font-weight: 900;
      font-size: 1rem;
      padding-top: 6px;
      border-top: 2px solid var(--border);
    }

    .message-box {
      grid-column: 1 / -1;
      background: var(--card);
      border: 2.5px solid var(--border);
      border-radius: 18px;
      padding: 24px 18px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .alert {
      margin-top: 12px;
      padding: 11px 12px;
      border-radius: 12px;
      border: 2.5px solid var(--border);
      font-size: 0.86rem;
      font-weight: 800;
      display: none;
      white-space: pre-line;
    }

    .alert.show {
      display: block;
    }

    .alert-success {
      background: #c8f5d6;
      color: #0d4a26;
    }

    .alert-error {
      background: #ffe4e6;
      color: #881337;
    }

    /* ================= POPUP CARD ID MODAL ================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(19, 33, 26, 0.65);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 9999;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .id-card-modal {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 3px solid var(--border);
      border-radius: 22px;
      box-shadow: 8px 8px 0px var(--border);
      overflow: hidden;
      animation: popIn 0.16s ease-out;
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.94) translateY(8px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .modal-header {
      background: var(--warn);
      border-bottom: 3px solid var(--border);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .modal-header h3 {
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 0.3px;
    }

    .modal-body {
      padding: 18px;
    }

    .id-card-box {
      background: var(--card-soft);
      border: 2.5px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      box-shadow: 4px 4px 0px var(--border);
      margin-bottom: 14px;
    }

    .id-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      margin-bottom: 10px;
      border-bottom: 2px dashed var(--border);
    }

    .id-card-badge {
      background: var(--zone-bg);
      color: var(--zone-ink);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 3px 9px;
      font-size: 0.74rem;
      font-weight: 900;
    }

    .id-card-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      padding: 6px 0;
      font-size: 0.9rem;
    }

    .id-card-row span:first-child {
      color: var(--muted);
      font-weight: 700;
      flex-shrink: 0;
    }

    .id-card-row strong {
      text-align: right;
      font-weight: 900;
      word-break: break-word;
    }

    .username-highlight {
      background: #c8f5d6;
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 2px 8px;
      color: #0d4a26;
      display: inline-block;
    }

    .sn-box {
      margin-top: 10px;
      background: #fffbeb;
      border: 2.5px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
    }

    .sn-label {
      font-size: 0.75rem;
      font-weight: 900;
      color: var(--muted);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sn-value {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.86rem;
      font-weight: 800;
      color: var(--ink);
      word-break: break-all;
      white-space: pre-wrap;
    }

    .spinner-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 22px 12px;
      gap: 12px;
    }

    .comic-spinner {
      width: 44px;
      height: 44px;
      border: 4px solid var(--card-alt);
      border-top-color: var(--primary);
      border-right-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .status-pill {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      border: 2px solid var(--border);
      font-size: 0.76rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .status-pending, .status-processing {
      background: var(--warn);
      color: var(--ink);
    }

    .status-success, .status-sukses {
      background: #c8f5d6;
      color: #0d4a26;
    }

    .status-failed, .status-gagal, .status-failed_refunded {
      background: #ffe4e6;
      color: #881337;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .modal-actions .btn {
      flex: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-nav">
      <div class="nav-group">
        <a href="/produk" class="btn btn-white">&larr; Kembali ke Produk</a>
        <a href="/dashboard" class="btn">Dashboard</a>
      </div>
      <span class="btn btn-green">DETAIL HARGA API</span>
    </div>

    <section class="hero-box">
      <div class="badge-tag">POW! TOPUP</div>
      <h1 class="hero-title" id="gameTitle">&#9889; DETAIL HARGA PRODUK</h1>
      <p class="hero-sub" id="gameSubtitle">Menampilkan detail nominal dan harga sesuai respons API.</p>

      <div class="toolbar">
        <div class="search-wrap">
          <input
            type="text"
            id="searchInput"
            class="input-field"
            placeholder="Cari nominal atau kode produk..."
            autocomplete="off"
          />
        </div>
        <button type="button" id="showAllBtn" class="btn btn-white">Semua Game</button>
        <button type="button" id="reloadBtn" class="btn">Refresh</button>
      </div>
    </section>

    <div class="layout-grid">
      <section>
        <div id="productsGrid" class="products-grid">
          <div class="message-box">
            <strong>Memuat detail harga...</strong>
            <p style="margin-top:6px;color:#496054;">Mengambil data dari endpoint harga.</p>
          </div>
        </div>
      </section>

      <aside class="order-panel">
        <h2>Detail &amp; Order</h2>

        <div class="summary-box">
          <div class="summary-row">
            <span>code</span>
            <strong id="sumCode">-</strong>
          </div>
          <div class="summary-row">
            <span>game</span>
            <strong id="sumGame">-</strong>
          </div>
          <div class="summary-row">
            <span>name</span>
            <strong id="sumName">Belum dipilih</strong>
          </div>
          <div class="summary-row">
            <span>need_zone</span>
            <span id="sumNeedZone">-</span>
          </div>
          <div class="summary-row">
            <span>check_name</span>
            <span id="sumCheckName">-</span>
          </div>
        </div>

        <form id="orderForm">
          <div class="form-group">
            <label for="targetInput">User ID / Target Tujuan</label>
            <input
              type="text"
              id="targetInput"
              class="input-field"
              placeholder="Masukkan User ID / Target"
              required
            />
          </div>

          <div class="form-group" id="zoneGroup">
            <label for="zoneInput">Zone ID / Server ID</label>
            <input
              type="text"
              id="zoneInput"
              class="input-field"
              placeholder="Masukkan Zone ID (jika need_zone: true)"
            />
          </div>

          <button type="submit" id="submitOrderBtn" class="btn btn-green" style="width: 100%;" disabled>
            Pilih Nominal Dulu
          </button>
        </form>

        <div id="orderAlert" class="alert"></div>
      </aside>
    </div>
  </div>

  <!-- POPUP CARD ID MODAL -->
  <div id="idCardModalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="id-card-modal">
      <div class="modal-header">
        <h3 id="modalTitle">KONFIRMASI DATA AKUN</h3>
        <button type="button" id="closeModalTopBtn" class="btn btn-white btn-sm" aria-label="Tutup">&times;</button>
      </div>
      <div class="modal-body" id="modalBodyContent">
        <!-- Konten dinamis: Loading Cek ID -> Konfirmasi Card ID -> Loading Order -> Sukses & SN -->
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let sessionData = {};
    try {
      sessionData = JSON.parse(sessionStorage.getItem("selectedGameData") || "{}");
    } catch (_) {}

    let activeGame = (urlParams.get("game") || urlParams.get("provider") || sessionData.game || "").trim();

    const gameTitleEl = document.getElementById("gameTitle");
    const gameSubtitleEl = document.getElementById("gameSubtitle");
    const productsGridEl = document.getElementById("productsGrid");
    const searchInputEl = document.getElementById("searchInput");
    const showAllBtn = document.getElementById("showAllBtn");
    const reloadBtn = document.getElementById("reloadBtn");

    const sumCodeEl = document.getElementById("sumCode");
    const sumGameEl = document.getElementById("sumGame");
    const sumNameEl = document.getElementById("sumName");
    const sumNeedZoneEl = document.getElementById("sumNeedZone");
    const sumCheckNameEl = document.getElementById("sumCheckName");

    const orderForm = document.getElementById("orderForm");
    const targetInput = document.getElementById("targetInput");
    const zoneGroup = document.getElementById("zoneGroup");
    const zoneInput = document.getElementById("zoneInput");
    const submitOrderBtn = document.getElementById("submitOrderBtn");
    const orderAlert = document.getElementById("orderAlert");

    const modalBackdrop = document.getElementById("idCardModalBackdrop");
    const modalTitleEl = document.getElementById("modalTitle");
    const modalBodyEl = document.getElementById("modalBodyContent");
    const closeModalTopBtn = document.getElementById("closeModalTopBtn");

    let allItems = [];
    let selectedItem = null;
    let activePollTimer = null;
    let isModalLocked = false;

    function formatRupiah(val) {
      const num = parseInt(val, 10);
      if (!Number.isFinite(num)) return "Rp 0";
      return "Rp " + num.toLocaleString("id-ID");
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function showAlert(type, msg) {
      orderAlert.className = `alert show alert-${type === "success" ? "success" : "error"}`;
      orderAlert.textContent = msg;
    }

    function stopPolling() {
      if (activePollTimer) {
        clearInterval(activePollTimer);
        activePollTimer = null;
      }
    }

    function openModal(locked = false) {
      isModalLocked = locked;
      closeModalTopBtn.disabled = locked;
      modalBackdrop.classList.add("open");
    }

    function closeModal(force = false) {
      if (isModalLocked && !force) return;
      stopPolling();
      modalBackdrop.classList.remove("open");
    }

    closeModalTopBtn.addEventListener("click", () => closeModal(false));
    modalBackdrop.addEventListener("click", (e) => {
      if (e.target === modalBackdrop) closeModal(false);
    });

    function selectItemCard(item, cardEl, scrollToOrder = false) {
      selectedItem = item;
      document.querySelectorAll(".item-card").forEach((c) => c.classList.remove("selected"));
      if (cardEl) cardEl.classList.add("selected");

      const reqZone = Boolean(item.need_zone);
      zoneGroup.style.display = reqZone ? "block" : "none";
      zoneInput.required = reqZone;

      sumCodeEl.textContent = item.code ?? "-";
      sumGameEl.textContent = item.game || item.provider || activeGame || "-";
      sumNameEl.textContent = item.name || "-";
      sumNeedZoneEl.textContent = String(Boolean(item.need_zone));
      sumCheckNameEl.textContent = String(Boolean(item.check_name));

      submitOrderBtn.disabled = false;
      submitOrderBtn.textContent = `Order (${formatRupiah(item.price)})`;
      orderAlert.className = "alert";
      if (scrollToOrder) {
        document.querySelector(".order-panel").scrollIntoView({ behavior: "smooth", block: "start" });
      }
    }

    function normalizeList(raw) {
      const list = Array.isArray(raw?.data) ? raw.data : Array.isArray(raw) ? raw : [];
      if (!activeGame) return list;

      const targetLower = activeGame.toLowerCase();
      const exactOrPartial = list.filter((item) => {
        const g = String(item.game || item.provider || "").toLowerCase();
        return g === targetLower || g.includes(targetLower) || targetLower.includes(g);
      });
      return exactOrPartial.length > 0 ? exactOrPartial : list;
    }

    function renderItems(list) {
      productsGridEl.innerHTML = "";

      if (!Array.isArray(list) || list.length === 0) {
        productsGridEl.innerHTML = `
          <div class="message-box">
            <strong>Data harga tidak ditemukan</strong>
            <p style="margin-top:6px;color:#496054;">Coba klik "Semua Game" atau periksa respons API.</p>
          </div>
        `;
        return;
      }

      list.forEach((item, idx) => {
        const card = document.createElement("div");
        card.className = "item-card";

        card.innerHTML = `
          <div class="item-top">
            <span class="chip chip-code">KODE: ${escapeHtml(item.code ?? "-")}</span>
          </div>
          <div class="item-name">${escapeHtml(item.name || "-")}</div>
          <div class="price-row">
            <span class="item-price">${formatRupiah(item.price)}</span>
          </div>
        `;

        card.addEventListener("click", () => selectItemCard(item, card, true));
        productsGridEl.appendChild(card);

        if (idx === 0) {
          selectItemCard(item, card);
        }
      });
    }

    async function fetchPriceDetail() {
      gameTitleEl.textContent = activeGame ? `⚡ ${activeGame}` : "⚡ DETAIL HARGA PRODUK";
      gameSubtitleEl.textContent = activeGame
        ? `Menampilkan daftar harga untuk ${activeGame} sesuai respons API.`
        : "Menampilkan seluruh daftar harga sesuai respons API.";

      productsGridEl.innerHTML = `
        <div class="message-box">
          <strong>Memuat data harga...</strong>
          <p style="margin-top:6px;color:#496054;">Menghubungi layanan price backend...</p>
        </div>
      `;

      const endpoints = ["/api/webtrx/layanan/price-list"];

      for (const ep of endpoints) {
        try {
          const res = await fetch(ep, {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(activeGame ? { game: activeGame, provider: activeGame } : {})
          });

          if (!res.ok) continue;
          const json = await res.json();
          const list = normalizeList(json);
          if (list.length > 0 || json?.success) {
            allItems = list;
            renderItems(allItems);
            return;
          }
        } catch (_) {}
      }

      productsGridEl.innerHTML = `
        <div class="message-box">
          <strong>Gagal memuat detail harga</strong>
          <p style="margin-top:6px;color:#496054;">Pastikan endpoint <code>/api/webtrx/layanan/price-list</code> aktif.</p>
        </div>
      `;
    }

    function renderCheckingLoading(item, tujuan, zone) {
      modalTitleEl.textContent = "MENGECEK ID AKUN...";
      openModal(true);
      modalBodyEl.innerHTML = `
        <div class="spinner-wrap">
          <div class="comic-spinner"></div>
          <strong>Mengecek Username Akun Game...</strong>
          <p style="font-size:0.84rem;color:var(--muted);">
            ID: <strong>${escapeHtml(tujuan)}</strong>${zone ? ` • Server: <strong>${escapeHtml(zone)}</strong>` : ""}
          </p>
        </div>
      `;
    }

    function renderCheckError(message) {
      modalTitleEl.textContent = "CEK AKUN GAGAL";
      openModal(false);
      modalBodyEl.innerHTML = `
        <div class="id-card-box" style="background:#ffe4e6;">
          <strong style="color:#881337;display:block;margin-bottom:6px;">Username Tidak Ditemukan</strong>
          <p style="font-size:0.88rem;color:#881337;">${escapeHtml(message || "Periksa kembali User ID / Server ID Anda.")}</p>
        </div>
        <div class="modal-actions">
          <button type="button" id="btnFixId" class="btn btn-white">Perbaiki ID</button>
        </div>
      `;
      document.getElementById("btnFixId").addEventListener("click", () => closeModal(true));
    }

    function renderConfirmCard(item, tujuan, zone, username) {
      const usesZone = Boolean(item.need_zone) || Boolean(zone);
      modalTitleEl.textContent = "KONFIRMASI CARD ID";
      openModal(false);

      modalBodyEl.innerHTML = `
        <div class="id-card-box">
          <div class="id-card-header">
            <strong style="font-size:0.95rem;">${escapeHtml(item.game || item.provider || activeGame || "PLAYER ID CARD")}</strong>
            <span class="id-card-badge">KODE ${escapeHtml(item.code)}</span>
          </div>
          <div class="id-card-row">
            <span>Username</span>
            <strong><span class="username-highlight">${escapeHtml(username || "-")}</span></strong>
          </div>
          <div class="id-card-row">
            <span>User ID</span>
            <strong>${escapeHtml(tujuan)}</strong>
          </div>
          ${usesZone ? `
          <div class="id-card-row">
            <span>Server / Zone ID</span>
            <strong>${escapeHtml(zone || "-")}</strong>
          </div>` : ""}
          <div class="id-card-row">
            <span>Produk</span>
            <strong>${escapeHtml(item.name)}</strong>
          </div>
          <div class="id-card-row" style="border-top:2px solid var(--border);margin-top:6px;padding-top:8px;">
            <span>Total Bayar</span>
            <strong style="color:var(--primary-dark);font-size:1.02rem;">${formatRupiah(item.price)}</strong>
          </div>
        </div>
        <p style="font-size:0.82rem;color:var(--muted);font-weight:700;">
          Pastikan Username, ID, dan Server ID di atas sudah benar sebelum melanjutkan order.
        </p>
        <div class="modal-actions">
          <button type="button" id="btnCancelConfirm" class="btn btn-white">Batal</button>
          <button type="button" id="btnConfirmOrder" class="btn btn-green">Order Sekarang</button>
        </div>
      `;

      document.getElementById("btnCancelConfirm").addEventListener("click", () => closeModal(true));
      document.getElementById("btnConfirmOrder").addEventListener("click", () => {
        executeOrderAndPoll(item, tujuan, zone, username);
      });
    }

    function renderOrderProgressCard({ item, tujuan, zone, username, txId, status, sn, message, isDone }) {
      const usesZone = Boolean(item.need_zone) || Boolean(zone);
      const normStatus = String(status || "processing").toLowerCase();
      const isSuccess = ["success", "sukses"].includes(normStatus);
      const isFailed = ["failed", "gagal", "failed_refunded", "cancel", "batal"].includes(normStatus);

      modalTitleEl.textContent = isSuccess
        ? "TRANSAKSI SUKSES!"
        : isFailed
        ? "TRANSAKSI GAGAL"
        : "MEMPROSES ORDER...";

      openModal(!isDone);

      const statusClass = isSuccess
        ? "status-success"
        : isFailed
        ? "status-failed"
        : "status-processing";

      modalBodyEl.innerHTML = `
        ${!isDone ? `
        <div class="spinner-wrap" style="padding:10px 0 14px;">
          <div class="comic-spinner"></div>
          <strong style="font-size:0.95rem;">Menunggu Konfirmasi Sukses &amp; SN...</strong>
          <span style="font-size:0.8rem;color:var(--muted);">Jangan tutup jendela ini sampai proses selesai.</span>
        </div>` : ""}

        <div class="id-card-box">
          <div class="id-card-header">
            <strong style="font-size:0.92rem;">${escapeHtml(item.name)}</strong>
            <span class="status-pill ${statusClass}">${escapeHtml(normStatus)}</span>
          </div>
          ${txId ? `
          <div class="id-card-row">
            <span>ID Transaksi</span>
            <strong style="font-size:0.82rem;">${escapeHtml(txId)}</strong>
          </div>` : ""}
          <div class="id-card-row">
            <span>Username</span>
            <strong><span class="username-highlight">${escapeHtml(username || "-")}</span></strong>
          </div>
          <div class="id-card-row">
            <span>User ID</span>
            <strong>${escapeHtml(tujuan)}</strong>
          </div>
          ${usesZone ? `
          <div class="id-card-row">
            <span>Server / Zone ID</span>
            <strong>${escapeHtml(zone || "-")}</strong>
          </div>` : ""}
          <div class="id-card-row">
            <span>Harga</span>
            <strong>${formatRupiah(item.price)}</strong>
          </div>

          <div class="sn-box">
            <div class="sn-label">
              <span>SERIAL NUMBER (SN)</span>
              ${sn ? `<button type="button" id="btnCopySn" class="btn btn-sm">Salin SN</button>` : ""}
            </div>
            <div class="sn-value">${sn ? escapeHtml(sn) : (isFailed ? "-" : "Menunggu SN dari provider...")}</div>
          </div>
        </div>

        ${message ? `<p style="font-size:0.82rem;font-weight:700;color:${isFailed ? "#881337" : "var(--muted)"};">${escapeHtml(message)}</p>` : ""}

        ${isDone ? `
        <div class="modal-actions">
          <button type="button" id="btnDoneClose" class="btn btn-green">Selesai</button>
        </div>` : ""}
      `;

      const copyBtn = document.getElementById("btnCopySn");
      if (copyBtn && sn) {
        copyBtn.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(String(sn));
            copyBtn.textContent = "Tersalin!";
            setTimeout(() => { copyBtn.textContent = "Salin SN"; }, 1800);
          } catch (_) {}
        });
      }

      const doneBtn = document.getElementById("btnDoneClose");
      if (doneBtn) {
        doneBtn.addEventListener("click", () => closeModal(true));
      }
    }

    async function executeOrderAndPoll(item, tujuan, zone, username) {
      stopPolling();
      renderOrderProgressCard({
        item,
        tujuan,
        zone,
        username,
        txId: "",
        status: "processing",
        sn: null,
        message: "Mengirim pesanan ke server...",
        isDone: false
      });

      try {
        const res = await fetch("/api/webtrx/order/create", {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            code: item.code,
            tujuan,
            target: tujuan,
            ...(zone ? { zone } : {})
          })
        });

        const json = await res.json();
        if (!res.ok || !json.success) {
          renderOrderProgressCard({
            item,
            tujuan,
            zone,
            username,
            txId: json.data?.id || "",
            status: "failed",
            sn: null,
            message: json.message || "Gagal membuat order.",
            isDone: true
          });
          showAlert("error", json.message || "Gagal membuat order.");
          return;
        }

        const txData = json.data || {};
        const txId = txData.id || "";
        const isCheckUsernameService = /cek\s*username|check\s*username|cek\s*id|cek\s*nickname/i.test(String(item.name || ""));
        let currentStatus = String(txData.status || "processing").toLowerCase();
        let currentSn = txData.sn || txData.data || null;
        if (isCheckUsernameService && (username || currentSn) && username !== "Tidak memerlukan cek nickname") {
          currentStatus = "success";
          if (!currentSn && username) {
            currentSn = `Username: ${username}`;
          }
        }

        const isImmediatelyFinal = ["success", "sukses", "failed", "gagal", "failed_refunded", "cancel", "batal"].includes(currentStatus);

        renderOrderProgressCard({
          item,
          tujuan,
          zone,
          username,
          txId,
          status: currentStatus,
          sn: currentSn,
          message: txData.message || (isImmediatelyFinal ? "" : "Transaksi sedang diproses provider..."),
          isDone: isImmediatelyFinal
        });

        if (isImmediatelyFinal || !txId) {
          if (["success", "sukses"].includes(currentStatus)) {
            showAlert("success", `Order berhasil!
ID: ${txId}
Status: ${currentStatus}${currentSn ? `
SN: ${currentSn}` : ""}`);
          }
          return;
        }

        // Polling status order sampai API sukses / gagal
        const pollStartedAt = Date.now();
        const maxPollMs = 5 * 60 * 1000;

        activePollTimer = setInterval(async () => {
          if (Date.now() - pollStartedAt > maxPollMs) {
            stopPolling();
            renderOrderProgressCard({
              item,
              tujuan,
              zone,
              username,
              txId,
              status: currentStatus,
              sn: currentSn,
              message: "Batas waktu tunggu tercapai. Cek riwayat mutasi order untuk SN terbaru.",
              isDone: true
            });
            return;
          }

          try {
            const checkRes = await fetch("/api/webtrx/order/check", {
              method: "POST",
              credentials: "include",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ id: txId })
            });

            if (!checkRes.ok) return;
            const checkJson = await checkRes.json();
            const d = checkJson.data || {};
            currentStatus = String(d.status || currentStatus).toLowerCase();
            currentSn = d.sn || currentSn || null;

            const isFinal = ["success", "sukses", "failed", "gagal", "failed_refunded", "cancel", "batal"].includes(currentStatus);

            renderOrderProgressCard({
              item,
              tujuan,
              zone,
              username,
              txId,
              status: currentStatus,
              sn: currentSn,
              message: d.message || (isFinal ? "" : "Sedang memproses topup & mengambil SN..."),
              isDone: isFinal
            });

            if (isFinal) {
              stopPolling();
              if (["success", "sukses"].includes(currentStatus)) {
                showAlert("success", `Order sukses!
ID: ${txId}
Username: ${username}
SN: ${currentSn || "-"}`);
              } else {
                showAlert("error", `Order ${currentStatus}.
ID: ${txId}`);
              }
            }
          } catch (_) {}
        }, 2000);
      } catch (err) {
        stopPolling();
        renderOrderProgressCard({
          item,
          tujuan,
          zone,
          username,
          txId: "",
          status: "failed",
          sn: null,
          message: err.message || "Terjadi kesalahan jaringan.",
          isDone: true
        });
        showAlert("error", err.message || "Terjadi kesalahan jaringan.");
      }
    }

    searchInputEl.addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      if (!q) {
        renderItems(allItems);
        return;
      }
      const filtered = allItems.filter(
        (it) =>
          String(it.name || "").toLowerCase().includes(q) ||
          String(it.code || "").toLowerCase().includes(q) ||
          String(it.game || "").toLowerCase().includes(q)
      );
      renderItems(filtered);
    });

    showAllBtn.addEventListener("click", () => {
      activeGame = "";
      searchInputEl.value = "";
      try { sessionStorage.removeItem("selectedGameData"); } catch (_) {}
      window.history.replaceState({}, "", "/produk-harga");
      fetchPriceDetail();
    });

    reloadBtn.addEventListener("click", () => {
      searchInputEl.value = "";
      fetchPriceDetail();
    });

    orderForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!selectedItem) {
        showAlert("error", "Pilih nominal produk terlebih dahulu.");
        return;
      }

      const tujuan = targetInput.value.trim();
      const zone = zoneInput.value.trim();
      if (!tujuan) {
        showAlert("error", "User ID / Target tujuan wajib diisi.");
        return;
      }
      if (Boolean(selectedItem.need_zone) && !zone) {
        showAlert("error", "Produk ini memiliki need_zone: true, isi Zone ID terlebih dahulu.");
        return;
      }

      orderAlert.className = "alert";
      submitOrderBtn.disabled = true;
      submitOrderBtn.textContent = "Mengecek Username...";

      try {
        // Jika produk mendukung check_name (atau default cek username), cek dulu ke /api/webtrx/check-name
        if (Boolean(selectedItem.check_name)) {
          renderCheckingLoading(selectedItem, tujuan, zone);

          const checkRes = await fetch("/api/webtrx/check-name", {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              code: selectedItem.code,
              tujuan,
              target: tujuan,
              ...(zone ? { zone } : {})
            })
          });

          const checkJson = await checkRes.json();
          if (!checkRes.ok || !checkJson.success || !checkJson.data?.username) {
            renderCheckError(checkJson.message || "Username tidak ditemukan. Pastikan User ID dan Server ID benar.");
            return;
          }

          renderConfirmCard(selectedItem, tujuan, zone, checkJson.data.username);
        } else {
          // Jika produk check_name: false, langsung tampilkan Card ID konfirmasi tanpa wajib nickname provider
          renderConfirmCard(selectedItem, tujuan, zone, "Tidak memerlukan cek nickname");
        }
      } catch (err) {
        renderCheckError(err.message || "Gagal menghubungi layanan cek username.");
      } finally {
        submitOrderBtn.disabled = false;
        submitOrderBtn.textContent = `Order (${formatRupiah(selectedItem.price)})`;
      }
    });

    fetchPriceDetail();
  </script>
</body>
</html>
