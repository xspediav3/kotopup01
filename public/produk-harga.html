<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Harga & Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --vp-primary: #22c55e;
            --vp-primary-light: #ecfdf3;
            --vp-primary-dark: #15803d;
            --vp-body-bg: #f2fbf4;
            --vp-card-bg: #ffffff;
            --vp-dark: #212529;
            --vp-text-muted: #66776b;
            --vp-border-color: #dcefe1;
            --vp-font-main: 'Manrope', sans-serif;
            --vp-font-heading: 'Poppins', sans-serif;
            --vp-radius-md: 0.5rem;
            --vp-radius-lg: 0.75rem;
            --vp-shadow-sm: 0 .125rem .25rem rgba(22, 101, 52, .06);
            --vp-shadow-md: 0 .5rem 1rem rgba(22, 101, 52, .12);
        }

        [data-theme="dark"] {
            --vp-primary: #4ade80;
            --vp-primary-light: rgba(74, 222, 128, 0.15);
            --vp-primary-dark: #22c55e;
            --vp-body-bg: #101b14;
            --vp-card-bg: #17251b;
            --vp-dark: #eaf5ec;
            --vp-text-muted: #a4b8a8;
            --vp-border-color: #2b4432;
        }

        body {
            font-family: var(--vp-font-main);
            background: linear-gradient(180deg, #effcf2 0%, #f8fff9 42%, #ffffff 100%);
            color: var(--vp-dark);
            min-height: 100vh;
        }

        [data-theme="dark"] body {
            background: linear-gradient(180deg, #101b14 0%, #14251a 48%, #101b14 100%);
        }

        .page-topbar {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--vp-border-color);
            padding: 0.85rem 1rem;
            position: sticky;
            top: 0;
            z-index: 1020;
        }

        [data-theme="dark"] .page-topbar {
            background: rgba(23, 37, 27, 0.9);
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            text-decoration: none;
            font-weight: 600;
            padding: 0.45rem 0.85rem;
            border-radius: var(--vp-radius-md);
            background-color: var(--vp-primary-light);
            color: var(--vp-primary-dark);
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            background-color: var(--vp-primary);
            color: #fff;
        }

        .vp-card {
            background-color: var(--vp-card-bg);
            border: 1px solid var(--vp-border-color);
            border-radius: var(--vp-radius-lg);
            box-shadow: var(--vp-shadow-sm);
            padding: 1.25rem;
        }

        .price-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 0.9rem;
        }

        .price-item {
            background-color: var(--vp-card-bg);
            border: 1.5px solid var(--vp-border-color);
            border-radius: var(--vp-radius-lg);
            padding: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .price-item:hover {
            transform: translateY(-2px);
            border-color: var(--vp-primary);
            box-shadow: var(--vp-shadow-md);
        }

        .price-item.selected {
            border-color: var(--vp-primary);
            background-color: var(--vp-primary-light);
            box-shadow: 0 0 0 0.2rem rgba(34, 197, 94, 0.2);
        }

        .product-name {
            font-family: var(--vp-font-heading);
            font-weight: 600;
            font-size: 0.92rem;
            margin-bottom: 0.4rem;
            line-height: 1.35;
        }

        .product-code {
            font-size: 0.72rem;
            color: var(--vp-text-muted);
            margin-bottom: 0.65rem;
        }

        .product-price {
            font-family: var(--vp-font-heading);
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--vp-primary-dark);
        }

        [data-theme="dark"] .product-price {
            color: var(--vp-primary);
        }

        .product-original-price {
            font-size: 0.78rem;
            text-decoration: line-through;
            color: var(--vp-text-muted);
            margin-left: 0.35rem;
        }

        .btn-order {
            background: linear-gradient(135deg, #4ade80 0%, #16a34a 100%);
            border: none;
            color: #fff;
            font-weight: 600;
            padding: 0.65rem 1.25rem;
            border-radius: var(--vp-radius-md);
            transition: all 0.2s ease;
        }

        .btn-order:hover {
            background: linear-gradient(135deg, #22c55e 0%, #15803d 100%);
            color: #fff;
        }

        .form-control {
            background-color: var(--vp-card-bg);
            border-color: var(--vp-border-color);
            color: var(--vp-dark);
        }

        .form-control:focus {
            border-color: var(--vp-primary);
            box-shadow: 0 0 0 0.2rem rgba(34, 197, 94, 0.2);
            background-color: var(--vp-card-bg);
            color: var(--vp-dark);
        }
    </style>
</head>
<body data-theme="light">
    <header class="page-topbar">
        <div class="container d-flex align-items-center justify-content-between gap-2">
            <a href="/produk-detail" class="btn-back">
                <i class="bi bi-arrow-left"></i>
                <span>Daftar Game</span>
            </a>
            <h5 id="gameTitle" class="mb-0 fw-bold text-truncate" style="font-family: var(--vp-font-heading);">Memuat Harga...</h5>
            <a href="/dashboard" class="btn-back">
                <i class="bi bi-house-door"></i>
                <span class="d-none d-sm-inline">Dashboard</span>
            </a>
        </div>
    </header>

    <main class="container py-4">
        <!-- Form Tujuan Akun -->
        <div class="vp-card mb-4">
            <h6 class="fw-bold mb-3" style="font-family: var(--vp-font-heading);">
                <i class="bi bi-person-badge text-success me-1"></i> 1. Masukkan Data Akun Tujuan
            </h6>
            <div class="row g-3">
                <div class="col-md-6" id="targetCol">
                    <label for="inputTarget" class="form-label small fw-semibold">User ID / Nomor Tujuan <span class="text-danger">*</span></label>
                    <input type="text" id="inputTarget" class="form-control" placeholder="Masukkan User ID / ID Akun">
                </div>
                <div class="col-md-6" id="zoneCol" style="display: none;">
                    <label for="inputZone" class="form-label small fw-semibold">Zone ID / Server <span class="text-danger">*</span></label>
                    <input type="text" id="inputZone" class="form-control" placeholder="Masukkan Zone ID / Server">
                </div>
            </div>
        </div>

        <!-- Daftar Harga Produk -->
        <div class="vp-card mb-4">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                <h6 class="fw-bold mb-0" style="font-family: var(--vp-font-heading);">
                    <i class="bi bi-tags text-success me-1"></i> 2. Pilih Nominal / Layanan
                </h6>
                <input type="text" id="searchNominal" class="form-control form-control-sm" style="max-width: 240px;" placeholder="Cari nominal...">
            </div>

            <div id="harga-container" class="price-grid">
                <div class="text-center py-5" style="grid-column: 1 / -1;">
                    <div class="spinner-border text-success" role="status"></div>
                    <p class="mt-2 text-muted mb-0">Memuat daftar harga...</p>
                </div>
            </div>
        </div>

        <!-- Ringkasan & Tombol Order -->
        <div class="vp-card" id="orderSummaryCard" style="display: none;">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
                <div>
                    <div class="small text-muted">Layanan Dipilih:</div>
                    <div class="fw-bold" id="selectedProductName">-</div>
                    <div class="small text-success fw-bold" id="selectedProductPrice">Rp 0</div>
                </div>
                <button type="button" id="btnSubmitOrder" class="btn btn-order">
                    <i class="bi bi-cart-check me-1"></i> Beli Sekarang
                </button>
            </div>
        </div>
    </main>

    <!-- Modal Hasil Order -->
    <div class="modal fade" id="orderResultModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="background-color: var(--vp-card-bg); color: var(--vp-dark); border-color: var(--vp-border-color);">
                <div class="modal-header" style="border-color: var(--vp-border-color);">
                    <h5 class="modal-title fw-bold" id="resultModalTitle">Status Transaksi</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="resultModalBody"></div>
                <div class="modal-footer" style="border-color: var(--vp-border-color);">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                    <a href="/dashboard" class="btn btn-order">Ke Dashboard</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script>
        const savedTheme = localStorage.getItem('vp-theme') || 'light';
        document.body.setAttribute('data-theme', savedTheme);

        const params = new URLSearchParams(window.location.search);
        const game = params.get("game") || params.get("provider") || "";
        const needZoneParam = params.get("need_zone") === "1" || params.get("need_zone") === "true";

        const gameTitle = document.getElementById("gameTitle");
        const zoneCol = document.getElementById("zoneCol");
        const inputTarget = document.getElementById("inputTarget");
        const inputZone = document.getElementById("inputZone");
        const searchNominal = document.getElementById("searchNominal");
        const hargaContainer = document.getElementById("harga-container");
        const orderSummaryCard = document.getElementById("orderSummaryCard");
        const selectedProductName = document.getElementById("selectedProductName");
        const selectedProductPrice = document.getElementById("selectedProductPrice");
        const btnSubmitOrder = document.getElementById("btnSubmitOrder");

        let allProducts = [];
        let selectedProduct = null;
        let requiresZone = needZoneParam;

        gameTitle.innerText = game ? game : "Semua Daftar Harga";
        if (requiresZone) {
            zoneCol.style.display = "block";
        }

        function formatRupiah(angka) {
            return "Rp " + Number(angka || 0).toLocaleString("id-ID");
        }

        function renderProducts(products) {
            hargaContainer.innerHTML = "";

            if (!products || products.length === 0) {
                hargaContainer.innerHTML = `
                    <div class="text-center py-5" style="grid-column: 1 / -1;">
                        <i class="bi bi-inbox fs-1 text-muted"></i>
                        <p class="mt-2 text-muted mb-0">Tidak ada daftar harga untuk game ini.</p>
                    </div>
                `;
                return;
            }

            // Cek jika ada produk yang need_zone: true
            if (products.some(p => Boolean(p.need_zone))) {
                requiresZone = true;
                zoneCol.style.display = "block";
            }

            products.forEach(item => {
                const isSelected = selectedProduct && String(selectedProduct.code) === String(item.code);
                const card = document.createElement("div");
                card.className = `price-item ${isSelected ? "selected" : ""}`;

                const displayPrice = item.flash ? item.flash : item.price;
                const originalPriceHtml = (item.price_original && item.price_original > displayPrice)
                    ? `<span class="product-original-price">${formatRupiah(item.price_original)}</span>`
                    : "";

                card.innerHTML = `
                    <div>
                        <div class="product-name">${item.name || item.layanan || "-"}</div>
                        <div class="product-code">Kode: ${item.code}</div>
                    </div>
                    <div class="d-flex align-items-center justify-content-between mt-2">
                        <div>
                            <span class="product-price">${formatRupiah(displayPrice)}</span>
                            ${originalPriceHtml}
                        </div>
                        <i class="bi ${isSelected ? "bi-check-circle-fill text-success" : "bi-plus-circle text-muted"} fs-5"></i>
                    </div>
                `;

                card.addEventListener("click", () => {
                    selectedProduct = item;
                    if (item.need_zone) {
                        requiresZone = true;
                        zoneCol.style.display = "block";
                    }
                    selectedProductName.innerText = `${item.name} (${item.code})`;
                    selectedProductPrice.innerText = formatRupiah(displayPrice);
                    orderSummaryCard.style.display = "block";
                    renderProducts(products);
                    orderSummaryCard.scrollIntoView({ behavior: "smooth", block: "nearest" });
                });

                hargaContainer.appendChild(card);
            });
        }

        async function loadHarga() {
            let url = "/api/webtrx/produk-provider";
            if (game) {
                url += `?game=${encodeURIComponent(game)}`;
            }

            try {
                const res = await fetch(url);
                const json = await res.json();

                if (!json.success || !Array.isArray(json.data)) {
                    allProducts = [];
                    renderProducts([]);
                    return;
                }

                // Urutkan harga termurah ke termahal
                allProducts = json.data.sort((a, b) => (Number(a.price) || 0) - (Number(b.price) || 0));
                renderProducts(allProducts);
            } catch (err) {
                console.error(err);
                hargaContainer.innerHTML = `
                    <div class="text-center py-5 text-danger" style="grid-column: 1 / -1;">
                        <p class="mb-0">Gagal memuat daftar harga. Silakan muat ulang halaman.</p>
                    </div>
                `;
            }
        }

        searchNominal.addEventListener("input", (e) => {
            const keyword = e.target.value.trim().toLowerCase();
            if (!keyword) {
                renderProducts(allProducts);
                return;
            }
            const filtered = allProducts.filter(item =>
                (item.name || "").toLowerCase().includes(keyword) ||
                String(item.code || "").toLowerCase().includes(keyword)
            );
            renderProducts(filtered);
        });

        btnSubmitOrder.addEventListener("click", async () => {
            if (!selectedProduct) {
                alert("Silakan pilih nominal layanan terlebih dahulu.");
                return;
            }

            const targetVal = inputTarget.value.trim();
            const zoneVal = inputZone.value.trim();

            if (!targetVal) {
                alert("Harap isi User ID / Nomor Tujuan.");
                inputTarget.focus();
                return;
            }

            if (requiresZone && !zoneVal) {
                alert("Game ini membutuhkan Zone ID / Server. Harap isi Zone ID.");
                inputZone.focus();
                return;
            }

            btnSubmitOrder.disabled = true;
            btnSubmitOrder.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> Memproses...`;

            try {
                const payload = {
                    code: selectedProduct.code,
                    tujuan: targetVal,
                };
                if (requiresZone && zoneVal) {
                    payload.zone = zoneVal;
                }

                const res = await fetch("/api/webtrx/order/create", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                });

                const result = await res.json();
                const modalTitle = document.getElementById("resultModalTitle");
                const modalBody = document.getElementById("resultModalBody");

                if (result.success && result.data) {
                    modalTitle.innerText = "Order Berhasil Dibuat";
                    modalBody.innerHTML = `
                        <div class="alert alert-success mb-3">Transaksi berhasil dikirim dan sedang diproses.</div>
                        <p class="mb-1"><strong>ID Transaksi:</strong> ${result.data.id || "-"}</p>
                        <p class="mb-1"><strong>Layanan:</strong> ${selectedProduct.name}</p>
                        <p class="mb-1"><strong>Tujuan:</strong> ${targetVal}${zoneVal ? ` (${zoneVal})` : ""}</p>
                        <p class="mb-1"><strong>Harga:</strong> ${formatRupiah(result.data.price)}</p>
                        <p class="mb-0"><strong>Status:</strong> <span class="badge bg-warning text-dark">${result.data.status || "pending"}</span></p>
                    `;
                } else {
                    modalTitle.innerText = "Order Gagal";
                    modalBody.innerHTML = `
                        <div class="alert alert-danger mb-0">${result.message || "Gagal membuat pesanan."}</div>
                    `;
                }

                const modal = new bootstrap.Modal(document.getElementById("orderResultModal"));
                modal.show();
            } catch (error) {
                alert("Terjadi kesalahan jaringan saat memproses order.");
            } finally {
                btnSubmitOrder.disabled = false;
                btnSubmitOrder.innerHTML = `<i class="bi bi-cart-check me-1"></i> Beli Sekarang`;
            }
        });

        loadHarga();
    </script>
</body>
</html>
